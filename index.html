<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZAMBIA STREET RACER 🇿🇲</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#07100b;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}
  window.startRace = function(){
#game{position:fixed;inset:0}
canvas{display:block}

#loading{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(circle at center,#173c27,#030806 70%);
  display:flex;align-items:center;justify-content:center;
  color:white;text-align:center;
}
.loadBox{width:min(420px,90vw)}
.logo{font-size:42px;font-weight:900;letter-spacing:3px}
.sub{margin-top:8px;color:#9ee7b7;letter-spacing:2px}
.bar{
  height:5px;background:#1a2b20;border-radius:10px;
  margin-top:28px;overflow:hidden
}
.bar i{
  display:block;height:100%;width:20%;
  background:#19d66b;
  animation:load 1.3s infinite
}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(600%)}}

#menu{
  position:fixed;inset:0;z-index:20;
  display:none;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.75));
  color:white;text-align:center;
}
.menuBox{
  width:min(500px,90vw);
  padding:30px;
  border-radius:24px;
  background:rgba(5,12,8,.78);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  box-shadow:0 25px 80px #000;
}
.menuBox h1{
  font-size:clamp(34px,8vw,64px);
  font-weight:1000;
  letter-spacing:2px;
}
.menuBox p{color:#b8c7bd;margin:10px 0 26px}
.start{
  border:0;border-radius:15px;
  padding:17px 35px;
  font-size:18px;font-weight:900;
  background:#11b957;color:#031008;
  box-shadow:0 10px 30px rgba(17,185,87,.3);
}
.small{
  margin-top:15px!important;
  font-size:12px;color:#789083!important;
}

#hud{
  display:none;
  position:fixed;inset:0;z-index:10;
  pointer-events:none;color:white;
}

.top{
  position:absolute;left:50%;top:15px;
  transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;
}
.badge{
  min-width:72px;
  padding:9px 13px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(8px);
  text-align:center;
}
.badge b{font-size:20px}
.badge small{display:block;color:#9ca9a0;font-size:9px;letter-spacing:1px}

#pos{
  position:absolute;left:18px;top:18px;
  font-size:32px;font-weight:1000;
  text-shadow:0 3px 8px #000;
}
#pos small{font-size:12px;color:#b8c7bd;display:block;letter-spacing:2px}

#speed{
  position:absolute;right:18px;bottom:25px;
  width:150px;height:150px;
  border-radius:50%;
  background:radial-gradient(circle,#142018 0 55%,#050805 56%);
  border:3px solid rgba(255,255,255,.22);
  box-shadow:0 10px 30px #0008;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
}
#speedNum{font-size:42px;font-weight:1000}
#speed small{font-size:10px;color:#a8b5ad;letter-spacing:2px}

#nitro{
  position:absolute;left:18px;bottom:25px;
  width:190px;
}
#nitro label{
  font-size:10px;font-weight:900;letter-spacing:2px;
}
.nbar{
  height:12px;border-radius:20px;
  background:#101812;margin-top:7px;
  overflow:hidden;border:1px solid #ffffff22;
}
#nitroFill{
  width:100%;height:100%;
  background:linear-gradient(90deg,#0bc6ff,#65efff,#fff);
  box-shadow:0 0 15px #00cfff;
}

#distance{
  position:absolute;left:50%;top:68px;
  transform:translateX(-50%);
  font-size:11px;letter-spacing:2px;
  color:#c9d2cc;
}

#map{
  position:absolute;right:18px;top:18px;
  width:150px;height:110px;
  border-radius:15px;
  background:rgba(0,0,0,.55);
  border:1px solid #ffffff22;
  overflow:hidden;
}
#map canvas{width:100%;height:100%}

#count{
  position:absolute;inset:0;
  display:none;align-items:center;justify-content:center;
  font-size:100px;font-weight:1000;
  text-shadow:0 5px 25px #000;
}

#message{
  position:absolute;inset:0;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);
}
#message h1{font-size:54px;font-weight:1000}
#message p{margin:8px;color:#c4d0c8}

#touch{
  position:absolute;inset:0;
  display:none;
}
.touchBtn{
  position:absolute;
  width:70px;height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.4);
  border:1px solid #ffffff33;
  color:white;
  font-size:27px;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
}
#left{left:18px;bottom:105px}
#right{left:100px;bottom:105px}
#brake{right:105px;bottom:105px;font-size:17px}
#boost{right:18px;bottom:105px;font-size:15px}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <div class="loadBox">
    <div class="logo">🇿🇲 ZSR</div>
    <div class="sub">ZAMBIA STREET RACER</div>
    <div class="bar"><i></i></div>
    <div style="margin-top:14px;font-size:12px;color:#718078">
      BUILDING THE STREETS...
    </div>
  </div>
</div>

<div id="menu">
  <div class="menuBox">
    <div style="font-size:14px;color:#52df8a;font-weight:900;letter-spacing:4px">
      🇿🇲 ZAMBIA
    </div>
    <h1>STREET RACER</h1>
    <p>LUSAKA NIGHTS • THE STREETS ARE YOURS</p>
    <button class="start" onclick="startRace()">START RACE</button>
    <p class="small">WASD / ARROWS TO DRIVE • SPACE FOR NITRO</p>
  </div>
</div>

<div id="hud">

  <div id="pos">
    <span id="position">1</span><small>POSITION</small>
  </div>

  <div class="top">
    <div class="badge">
      <b id="lap">01</b>
      <small>RACE</small>
    </div>
    <div class="badge">
      <b id="timer">00:00</b>
      <small>TIME</small>
    </div>
  </div>

  <div id="distance">0 / 3000 M</div>

  <div id="map">
    <canvas id="mapCanvas"></canvas>
  </div>

  <div id="nitro">
    <label>NITRO</label>
    <div class="nbar"><div id="nitroFill"></div></div>
  </div>

  <div id="speed">
    <div id="speedNum">0</div>
    <small>KM/H</small>
  </div>

  <div id="count">3</div>

  <div id="message">
    <h1>FINISH!</h1>
    <p id="finishText">You finished the race.</p>
    <button class="start" onclick="location.reload()">RACE AGAIN</button>
  </div>

  <div id="touch">
    <div class="touchBtn" id="left">◀</div>
    <div class="touchBtn" id="right">▶</div>
    <div class="touchBtn" id="brake">BRAKE</div>
    <div class="touchBtn" id="boost">NITRO</div>
  </div>

</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const $ = id => document.getElementById(id);

let scene,camera,renderer,clock;
let player,playerModel;
let road=[];
let traffic=[];
let scenery=[];
let gameStarted=false;
let finished=false;

let speed=0;
let distance=0;
let nitro=100;
let startTime=0;

const keys={
  left:false,
  right:false,
  accelerate:false,
  brake:false,
  nitro:false
};

const ROAD_LENGTH=3000;
const ROAD_WIDTH=13;

init();

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x91b9d0);
  scene.fog=new THREE.Fog(0x91b9d0,70,350);

  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    1000
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;

  $("game").appendChild(renderer.domElement);

  clock=new THREE.Clock();

  createLights();
  createWorld();
  createRoad();
  createPlayer();
  createTraffic();
  createScenery();

  addEvents();

  setTimeout(()=>{
    $("loading").style.display="none";
    $("menu").style.display="flex";
  },1200);

  animate();
}

function createLights(){

  const hemi=new THREE.HemisphereLight(
    0xbfe5ff,
    0x30482d,
    2.2
  );
  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    3.5
  );

  sun.position.set(-80,120,80);
  sun.castShadow=true;

  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-150;
  sun.shadow.camera.right=150;
  sun.shadow.camera.top=150;
  sun.shadow.camera.bottom=-150;

  scene.add(sun);
}

function createWorld(){

  const groundGeo=new THREE.PlaneGeometry(800,5000);
  const groundMat=new THREE.MeshStandardMaterial({
    color:0x496b3b,
    roughness:1
  });

  const ground=new THREE.Mesh(
    groundGeo,
    groundMat
  );

  ground.rotation.x=-Math.PI/2;
  ground.position.y=-.15;
  ground.position.z=-1800;

  ground.receiveShadow=true;
  scene.add(ground);

  // distant mountains
  for(let i=0;i<24;i++){

    const h=30+Math.random()*80;
    const w=50+Math.random()*100;

    const geo=new THREE.ConeGeometry(
      w,
      h,
      5
    );

    const mat=new THREE.MeshStandardMaterial({
      color:0x405f42,
      roughness:1
    });

    const m=new THREE.Mesh(geo,mat);

    m.position.set(
      (i%2?1:-1)*(90+Math.random()*100),
      h/2-1,
      -i*180-100
    );

    m.rotation.y=Math.random()*2;
    scene.add(m);
  }
}

function createRoad(){

  const roadMat=new THREE.MeshStandardMaterial({
    color:0x25292a,
    roughness:.88
  });

  const roadGeo=new THREE.PlaneGeometry(
    ROAD_WIDTH,
    120
  );

  for(let z=0;z<ROAD_LENGTH;z+=100){

    const roadPiece=new THREE.Mesh(
      roadGeo,
      roadMat
    );

    roadPiece.rotation.x=-Math.PI/2;
    roadPiece.position.z=-z;
    roadPiece.receiveShadow=true;

    scene.add(roadPiece);
    road.push(roadPiece);

    // road shoulders
    const shoulderMat=new THREE.MeshStandardMaterial({
      color:0xb7a76d,
      roughness:1
    });

    for(const side of [-1,1]){

      const shoulder=new THREE.Mesh(
        new THREE.BoxGeometry(2.5,0.08,100),
        shoulderMat
      );

      shoulder.position.set(
        side*(ROAD_WIDTH/2+1.2),
        .01,
        -z
      );

      shoulder.receiveShadow=true;
      scene.add(shoulder);
    }

    // centre markings
    for(let x=-45;x<45;x+=15){

      const mark=new THREE.Mesh(
        new THREE.BoxGeometry(.18,.025,7),
        new THREE.MeshBasicMaterial({color:0xffffff})
      );

      mark.position.set(0,.035,-z+x);
      scene.add(mark);
    }

    // lane markings
    for(const x of [-4.3,4.3]){

      for(let q=-45;q<45;q+=16){

        const mark=new THREE.Mesh(
          new THREE.BoxGeometry(.12,.022,8),
          new THREE.MeshBasicMaterial({
            color:0xdedede
          })
        );

        mark.position.set(x,.036,-z+q);
        scene.add(mark);
      }
    }
  }
}

function createPlayer(){

  player=new THREE.Group();

  player.position.set(0,.15,4);

  scene.add(player);

  // detailed fallback sports-car body
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(2.15,.55,4.3),
    new THREE.MeshStandardMaterial({
      color:0x121416,
      metalness:.65,
      roughness:.25
    })
  );

  body.position.y=.75;
  body.castShadow=true;
  player.add(body);

  const cabin=new THREE.Mesh(
    new THREE.BoxGeometry(1.55,.55,1.8),
    new THREE.MeshStandardMaterial({
      color:0x10191c,
      metalness:.2,
      roughness:.12
    })
  );

  cabin.position.set(0,1.2,.1);
  cabin.castShadow=true;
  player.add(cabin);

  // hood
  const hood=new THREE.Mesh(
    new THREE.BoxGeometry(1.9,.18,1.5),
    new THREE.MeshStandardMaterial({
      color:0x171b1c,
      metalness:.7,
      roughness:.2
    })
  );

  hood.position.set(0,.95,-1.35);
  player.add(hood);

  // wheels
  createWheel(-1.05,.48,-1.35);
  createWheel(1.05,.48,-1.35);
  createWheel(-1.05,.48,1.35);
  createWheel(1.05,.48,1.35);

  // rear lights
  for(const x of [-.65,.65]){

    const light=new THREE.Mesh(
      new THREE.BoxGeometry(.5,.13,.08),
      new THREE.MeshStandardMaterial({
        color:0xff1600,
        emissive:0xff1200,
        emissiveIntensity:2
      })
    );

    light.position.set(x,.82,2.18);
    player.add(light);
  }

  // load a free GLB vehicle model.
  const loader=new GLTFLoader();

  loader.load(
    "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Buggy/glTF-Binary/Buggy.glb",
    gltf=>{

      if(!gameStarted)return;

      playerModel=gltf.scene;

      playerModel.scale.setScalar(1.15);
      playerModel.position.y=.15;

      playerModel.traverse(o=>{
        if(o.isMesh){
          o.castShadow=true;
          o.receiveShadow=true;
        }
      });

      player.add(playerModel);
    },
    undefined,
    ()=>{}
  );
}

function createWheel(x,y,z){

  const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .38,.38,.28,24
    ),
    new THREE.MeshStandardMaterial({
      color:0x080808,
      roughness:.9
    })
  );

  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,y,z);
  wheel.castShadow=true;

  player.add(wheel);
}

function createTraffic(){

  const colors=[
    0xd71920,
    0xffffff,
    0x111111,
    0x173e78,
    0x777777,
    0x159447
  ];

  for(let i=0;i<9;i++){

    const car=new THREE.Group();

    car.position.set(
      [-4.3,0,4.3][Math.floor(Math.random()*3)],
      .15,
      -70-i*85
    );

    const body=new THREE.Mesh(
      new THREE.BoxGeometry(2,.6,4),
      new THREE.MeshStandardMaterial({
        color:colors[i%colors.length],
        metalness:.45,
        roughness:.3
      })
    );

    body.position.y=.65;
    body.castShadow=true;
    car.add(body);

    const roof=new THREE.Mesh(
      new THREE.BoxGeometry(1.45,.55,1.65),
      new THREE.MeshStandardMaterial({
        color:0x15191b,
        roughness:.18
      })
    );

    roof.position.y=1.05;
    car.add(roof);

    traffic.push({
      mesh:car,
      speed:45+Math.random()*20
    });

    scene.add(car);
  }
}

function createScenery(){

  for(let z=0;z<ROAD_LENGTH;z+=35){

    for(const side of [-1,1]){

      if(Math.random()<.72){

        const tree=createTree();

        tree.position.set(
          side*(12+Math.random()*30),
          0,
          -z-Math.random()*20
        );

        scenery.push(tree);
        scene.add(tree);
      }

      if(Math.random()<.20){

        const building=createBuilding();

        building.position.set(
          side*(28+Math.random()*30),
          0,
          -z-Math.random()*15
        );

        scenery.push(building);
        scene.add(building);
      }
    }
  }

  // streetlights
  for(let z=0;z<ROAD_LENGTH;z+=55){

    for(const side of [-1,1]){

      const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(.06,.09,6,8),
        new THREE.MeshStandardMaterial({
          color:0x333333,
          metalness:.7
        })
      );

      pole.position.set(
        side*9,
        3,
        -z
      );

      scene.add(pole);

      const lamp=new THREE.PointLight(
        0xffd18a,
        .7,
        18
      );

      lamp.position.set(
        side*9,
        6,
        -z
      );

      scene.add(lamp);
    }
  }
}

function createTree(){

  const g=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.18,.3,2.3,8),
    new THREE.MeshStandardMaterial({
      color:0x5b3820
    })
  );

  trunk.position.y=1.15;
  trunk.castShadow=true;
  g.add(trunk);

  for(let i=0;i<3;i++){

    const leaf=new THREE.Mesh(
      new THREE.SphereGeometry(
        1.3-i*.18,
        10,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x1d6332,
        roughness:1
      })
    );

    leaf.position.set(
      (Math.random()-.5)*.5,
      2.2+i*.65,
      (Math.random()-.5)*.5
    );

    leaf.castShadow=true;
    g.add(leaf);
  }

  return g;
}

function createBuilding(){

  const h=5+Math.random()*12;
  const w=5+Math.random()*8;

  const b=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,6),
    new THREE.MeshStandardMaterial({
      color:0x8b806d,
      roughness:.9
    })
  );

  b.position.y=h/2;
  b.castShadow=true;

  const g=new THREE.Group();
  g.add(b);

  for(let y=1.5;y<h;y+=2.2){

    for(let x=-w/3;x<w/3;x+=1.5){

      const window=new THREE.Mesh(
        new THREE.BoxGeometry(.55,.7,.03),
        new THREE.MeshBasicMaterial({
          color:Math.random()>.5?0xffdf91:0x32424a
        })
      );

      window.position.set(
        x,y,
        3.02
      );

      g.add(window);
    }
  }

  return g;
}

function startRace(){

  $("menu").style.display="none";
  $("hud").style.display="block";
  $("touch").style.display="block";

  gameStarted=true;
  startTime=performance.now();

  countdown();
}

function countdown(){

  const el=$("count");

  el.style.display="flex";

  let n=3;
  el.textContent=n;

  const t=setInterval(()=>{

    n--;

    if(n<=0){

      clearInterval(t);
      el.textContent="GO!";

      setTimeout(()=>{
        el.style.display="none";
      },700);

      return;
    }

    el.textContent=n;

  },800);
}

function updateGame(dt){

  if(!gameStarted||finished)return;

  let target=85;

  if(keys.accelerate)target=135;

  if(keys.brake)target=35;

  if(keys.nitro&&nitro>0){

    target=205;
    nitro-=38*dt;

  }else{

    nitro+=12*dt;
  }

  nitro=THREE.MathUtils.clamp(nitro,0,100);

  speed=THREE.MathUtils.lerp(
    speed,
    target,
    2.5*dt
  );

  if(keys.left){
    player.position.x-=5.5*dt;
    player.rotation.y=.12;
  }else if(keys.right){
    player.position.x+=5.5*dt;
    player.rotation.y=-.12;
  }else{
    player.rotation.y=THREE.MathUtils.lerp(
      player.rotation.y,
      0,
      5*dt
    );
  }

  player.position.x=THREE.MathUtils.clamp(
    player.position.x,
    -5.0,
    5.0
  );

  const meters=speed*dt*.9;

  distance+=meters;

  player.position.z-=meters;

  // move traffic toward player
  for(const t of traffic){

    t.mesh.position.z+=
      (speed-t.speed)*dt*.045;

    if(t.mesh.position.z>12){

      t.mesh.position.z=
        player.position.z-500-Math.random()*500;

      t.mesh.position.x=
        [-4.3,0,4.3][Math.floor(Math.random()*3)];
    }
  }

  // keep world around player
  for(const o of scenery){

    if(o.position.z>player.position.z+80){

      o.position.z-=ROAD_LENGTH;
    }
  }

  updateCamera(dt);
  updateHUD();

  if(distance>=ROAD_LENGTH){

    finishRace();
  }
}

function updateCamera(dt){

  const desired=new THREE.Vector3(
    player.position.x,
    player.position.y+4.2,
    player.position.z+10
  );

  camera.position.lerp(
    desired,
    1-Math.pow(.001,dt)
  );

  const look=new THREE.Vector3(
    player.position.x,
    player.position.y+.7,
    player.position.z-18
  );

  camera.lookAt(look);
}

function updateHUD(){

  $("speedNum").textContent=
    Math.round(speed);

  $("nitroFill").style.width=
    nitro+"%";

  $("distance").textContent=
    Math.min(Math.floor(distance),ROAD_LENGTH)
    +" / "+ROAD_LENGTH+" M";

  const elapsed=(performance.now()-startTime)/1000;

  const min=Math.floor(elapsed/60)
    .toString().padStart(2,"0");

  const sec=Math.floor(elapsed%60)
    .toString().padStart(2,"0");

  $("timer").textContent=min+":"+sec;

  drawMap();
}

function drawMap(){

  const c=$("mapCanvas");
  const ctx=c.getContext("2d");

  c.width=300;
  c.height=220;

  ctx.clearRect(0,0,300,220);

  ctx.fillStyle="#18261d";
  ctx.fillRect(0,0,300,220);

  ctx.strokeStyle="#d6d6d6";
  ctx.lineWidth=12;

  ctx.beginPath();
  ctx.moveTo(150,220);
  ctx.bezierCurveTo(
    110,170,
    190,120,
    145,80
  );
  ctx.bezierCurveTo(
    100,45,
    180,25,
    150,0
  );
  ctx.stroke();

  ctx.fillStyle="#19df6b";
  ctx.beginPath();
  ctx.arc(150,190,7,0,Math.PI*2);
  ctx.fill();
}

function finishRace(){

  finished=true;

  $("message").style.display="flex";

  $("finishText").textContent=
    "FINISH — TIME "+$("timer").textContent;
}

function addEvents(){

  addEventListener("resize",()=>{

    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth,innerHeight);
  });

  addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
      keys.left=true;

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
      keys.right=true;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
      keys.accelerate=true;

    if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
      keys.brake=true;

    if(e.code==="Space"||e.key.toLowerCase()==="shift")
      keys.nitro=true;
  });

  addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
      keys.left=false;

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
      keys.right=false;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
      keys.accelerate=false;

    if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
      keys.brake=false;

    if(e.code==="Space"||e.key.toLowerCase()==="shift")
      keys.nitro=false;
  });

  bindTouch("left","left");
  bindTouch("right","right");
  bindTouch("brake","brake");
  bindTouch("boost","nitro");
}

function bindTouch(id,key){

  const el=$(id);

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  el.addEventListener("pointerup",e=>{
    e.preventDefault();
    keys[key]=false;
  });

  el.addEventListener("pointercancel",()=>{
    keys[key]=false;
  });

  el.addEventListener("pointerleave",()=>{
    keys[key]=false;
  });
}

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.05);

  updateGame(dt);

  renderer.render(scene,camera);
}

</script>
