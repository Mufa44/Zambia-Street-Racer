<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZAMBIA STREET RACER</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020304;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
touch-action:none;
}

button{font-family:inherit}

.hidden{
opacity:0!important;
visibility:hidden!important;
pointer-events:none!important;
}

/* ================= INTRO ================= */

#intro{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
background:
radial-gradient(circle at 50% 20%,rgba(0,190,85,.22),transparent 35%),
linear-gradient(180deg,#07150d,#020403 70%);
transition:1.1s ease;
}

#intro.hide{
opacity:0;
visibility:hidden;
pointer-events:none;
}

.intro-grid{
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,255,110,.035) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,110,.035) 1px,transparent 1px);
background-size:70px 70px;
transform:perspective(500px) rotateX(55deg) scale(1.8);
transform-origin:bottom;
animation:gridMove 5s linear infinite;
}

@keyframes gridMove{
from{background-position:0 0}
to{background-position:0 140px}
}

.intro-vignette{
position:absolute;
inset:0;
background:radial-gradient(circle,transparent 20%,rgba(0,0,0,.85) 100%);
}

.intro-content{
position:relative;
z-index:2;
width:min(900px,94vw);
}

.zambia{
font-size:68px;
filter:drop-shadow(0 0 25px rgba(0,255,100,.5));
animation:float 3s ease-in-out infinite;
}

@keyframes float{
50%{transform:translateY(-8px)}
}

.intro-content h1{
font-size:clamp(42px,9vw,100px);
font-weight:1000;
line-height:.85;
letter-spacing:8px;
margin:20px 0;
text-shadow:
0 0 10px rgba(255,255,255,.4),
0 0 35px rgba(0,255,110,.35);
}

.intro-content h1 span{
color:#18df70;
}

.intro-line{
height:3px;
width:300px;
max-width:70%;
margin:20px auto;
background:linear-gradient(90deg,transparent,#18df70,transparent);
box-shadow:0 0 25px #18df70;
}

.intro-sub{
font-size:12px;
letter-spacing:6px;
color:#a9b8af;
}

.intro-cars{
margin-top:18px;
font-size:10px;
letter-spacing:3px;
color:#52645a;
}

.enter-btn{
margin-top:35px;
padding:19px 58px;
font-size:13px;
font-weight:900;
letter-spacing:4px;
color:#001508;
background:linear-gradient(180deg,#39f58a,#08a94e);
border:1px solid #5cff9e;
cursor:pointer;
clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
box-shadow:0 0 30px rgba(20,240,110,.35);
transition:.25s;
}

.enter-btn:hover{
transform:scale(1.06);
box-shadow:0 0 55px rgba(20,240,110,.7);
}

.intro-foot{
margin-top:22px;
font-size:9px;
letter-spacing:3px;
color:#3f5147;
}

/* ================= GARAGE ================= */

#garage{
position:fixed;
inset:0;
z-index:20;
visibility:hidden;
opacity:0;
transition:1s;
background:#050708;
}

#garage.show{
visibility:visible;
opacity:1;
}

#garageCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.garage-top{
position:absolute;
z-index:5;
top:0;
left:0;
right:0;
height:75px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 22px;
background:linear-gradient(180deg,rgba(0,0,0,.95),transparent);
}

.brand{
font-size:14px;
font-weight:900;
letter-spacing:3px;
}

.brand span{
color:#18df70;
}

.wallet{
padding:10px 15px;
background:rgba(0,0,0,.6);
border:1px solid rgba(255,255,255,.15);
border-radius:8px;
font-size:13px;
font-weight:bold;
}

.wallet span{
color:#20e276;
}

.garage-panel{
position:absolute;
z-index:5;
top:95px;
left:20px;
width:370px;
max-width:calc(100vw - 40px);
padding:20px;
border-left:3px solid #16d66b;
border-radius:0 15px 15px 0;
background:linear-gradient(135deg,rgba(5,12,8,.95),rgba(2,5,4,.82));
box-shadow:0 20px 70px rgba(0,0,0,.65);
backdrop-filter:blur(14px);
}

.car-nav{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.arrow{
width:45px;
height:42px;
border:1px solid #23442f;
border-radius:8px;
background:#09150e;
color:#fff;
font-size:24px;
cursor:pointer;
}

.car-count{
font-size:10px;
letter-spacing:2px;
color:#87958d;
}

.car-type{
font-size:10px;
font-weight:bold;
letter-spacing:3px;
color:#19e271;
}

.car-name{
font-size:27px;
margin-top:5px;
letter-spacing:1px;
}

.car-year{
font-size:10px;
letter-spacing:1px;
color:#87958d;
margin-top:6px;
}

.stats{
margin-top:18px;
}

.stat{
margin-bottom:11px;
}

.stat-title{
display:flex;
justify-content:space-between;
font-size:9px;
letter-spacing:1px;
color:#b7c1bb;
margin-bottom:4px;
}

.stat-track{
height:5px;
background:#17201b;
border-radius:20px;
overflow:hidden;
}

.stat-fill{
height:100%;
background:linear-gradient(90deg,#087d3d,#28f383);
box-shadow:0 0 10px rgba(22,214,107,.45);
}

.car-list{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px;
margin-top:15px;
max-height:110px;
overflow:auto;
padding-right:2px;
}

.car-list button{
padding:8px 5px;
font-size:8px;
background:#08120d;
border:1px solid #1d3928;
color:#91a399;
border-radius:6px;
cursor:pointer;
}

.car-list button.active{
background:#16d66b;
color:#00170a;
font-weight:900;
}

.start-race{
width:100%;
margin-top:14px;
padding:15px;
border:1px solid #42f892;
border-radius:8px;
background:linear-gradient(180deg,#0bc25e,#079448);
color:#00170a;
font-weight:1000;
letter-spacing:2px;
cursor:pointer;
box-shadow:0 0 22px rgba(22,214,107,.25);
}

.garage-buttons{
display:flex;
gap:7px;
margin-top:8px;
}

.small-btn{
flex:1;
padding:10px;
background:#09150e;
border:1px solid #23432f;
color:white;
border-radius:7px;
cursor:pointer;
font-size:9px;
letter-spacing:1px;
}

.garage-hint{
position:absolute;
z-index:5;
bottom:22px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
}

.hint-item{
padding:8px 13px;
border:1px solid rgba(255,255,255,.1);
background:rgba(0,0,0,.55);
border-radius:20px;
font-size:9px;
letter-spacing:1px;
color:#84928a;
}

.music-btn{
position:absolute;
z-index:8;
right:20px;
bottom:20px;
padding:11px 17px;
background:rgba(0,0,0,.7);
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
color:white;
font-size:11px;
cursor:pointer;
}

/* ================= RACE ================= */

#race{
position:fixed;
inset:0;
z-index:80;
display:none;
background:#020508;
}

#race.active{
display:block;
}

#raceCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.race-ui{
position:absolute;
inset:0;
z-index:3;
pointer-events:none;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.race-top{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
padding:15px 18px;
background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);
font-size:10px;
letter-spacing:2px;
}

.race-top div:nth-child(2){
text-align:center;
}

.race-top div:last-child{
text-align:right;
}

.race-bottom{
padding:14px;
background:linear-gradient(0deg,rgba(0,0,0,.95),transparent);
pointer-events:auto;
}

.race-stats{
display:flex;
justify-content:space-between;
align-items:end;
margin-bottom:7px;
}

.speed{
font-size:36px;
font-weight:1000;
letter-spacing:2px;
}

.speed small{
font-size:11px;
color:#8da097;
}

.nitro-label{
font-size:9px;
letter-spacing:3px;
color:#8da097;
}

.nitro-track{
height:9px;
background:#111817;
border:1px solid #28312d;
border-radius:20px;
overflow:hidden;
}

#nitroBar{
height:100%;
width:100%;
background:linear-gradient(90deg,#087d3d,#30ff91);
box-shadow:0 0 18px #16d66b;
}

.race-controls{
display:grid;
grid-template-columns:1fr 1.3fr 1fr;
gap:9px;
margin-top:9px;
}

.race-control{
padding:18px 10px;
background:rgba(7,20,13,.92);
border:1px solid #23432f;
color:#fff;
border-radius:10px;
font-size:17px;
font-weight:900;
touch-action:none;
}

.nitro-control{
background:linear-gradient(180deg,#0cc460,#078e47);
color:#00170a;
border-color:#3af98c;
}

.exit-race{
width:100%;
margin-top:8px;
padding:10px;
background:#090d0b;
border:1px solid #26342c;
color:#9ba9a1;
border-radius:7px;
cursor:pointer;
}

#countdown{
position:absolute;
z-index:10;
left:50%;
top:43%;
transform:translate(-50%,-50%);
font-size:90px;
font-weight:1000;
letter-spacing:8px;
text-shadow:0 0 25px white,0 0 80px #16d66b;
}

#finish{
position:absolute;
z-index:20;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
background:rgba(0,0,0,.9);
}

#finish.show{
display:flex;
}

.finish-title{
font-size:58px;
letter-spacing:7px;
color:#18df70;
text-shadow:0 0 35px #18df70;
}

.finish-info{
margin:12px 0 25px;
color:#aab7af;
font-size:12px;
letter-spacing:2px;
}

.finish-btn{
padding:16px 40px;
background:#16d66b;
border:0;
border-radius:8px;
font-weight:900;
cursor:pointer;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

.garage-panel{
left:10px;
right:10px;
bottom:58px;
top:auto;
width:auto;
}

.garage-hint{
display:none;
}

.music-btn{
top:82px;
bottom:auto;
right:10px;
}

.garage-top{
padding:0 12px;
}

.brand{
font-size:11px;
}

.car-name{
font-size:23px;
}

.car-list{
max-height:75px;
}

.intro-content h1{
letter-spacing:4px;
}

.zambia{
font-size:55px;
}

.intro-sub{
letter-spacing:3px;
}

#countdown{
font-size:65px;
}

}

@media(max-height:650px){

.garage-panel{
padding:12px;
}

.stats{
margin-top:9px;
}

.stat{
margin-bottom:6px;
}

.car-list{
max-height:70px;
}

.start-race{
padding:11px;
}

}
</style>
</head>

id="nitroBtn">
💨 NITRO
</button>

id="rightBtn">

</button>

</div>

</button>

</div>

</section>

/* =====================================================

===================================================== */

let currentCar=0;

let garageScene;
let garageCamera;
let garageRenderer;

let garageRotation=0;

let mouseDown=false;

/* =====================================================

===================================================== */

const $=id=>document.getElementById(id);


/* =====================================================
   GARAGE UI
===================================================== */

function updateGarageUI(){

const car=CARS[currentCar];

$("carCount").textContent=
`${currentCar+1} / ${CARS.length}`;

$("carName").textContent=car.name;

$("carType").textContent=car.type;

$("carYear").textContent=car.year;

$("stats").innerHTML=`

<div class="stat">
<div class="stat-title">
<span>TOP SPEED</span>
<span>${car.top}%</span>
</div>
<div class="stat-track">
<div class="stat-fill" style="width:${car.top}%"></div>
</div>
</div>

<div class="stat">
<div class="stat-title">
<span>ACCELERATION</span>
<span>${car.acc}%</span>
</div>
<div class="stat-track">
<div class="stat-fill" style="width:${car.acc}%"></div>
</div>
</div>

<div class="stat">
<div class="stat-title">
<span>HANDLING</span>
<span>${car.hand}%</span>
</div>
<div class="stat-track">
<div class="stat-fill" style="width:${car.hand}%"></div>
</div>
</div>
`;

$("carList").innerHTML=CARS.map((c,i)=>`

<button
class="${i===currentCar?"active":""}"
onclick="selectCar(${i})">

${c.name}

</button>

`).join("");

buildGarageCar(car);

}


/* =====================================================
   GARAGE INITIALIZATION
===================================================== */

function initGarage(){

if(garageRenderer)return;

garageScene=new THREE.Scene();

garageScene.background=new THREE.Color(0x050708);

garageScene.fog=
new THREE.Fog(0x050708,12,45);


garageCamera=
new THREE.PerspectiveCamera(
42,
innerWidth/innerHeight,
0.1,
100
);

garageCamera.position.set(
7,
3.7,
8
);


garageRenderer=
new THREE.WebGLRenderer({
canvas:$("garageCanvas"),
antialias:true,
powerPreference:"high-performance"
});

garageRenderer.setPixelRatio(
Math.min(devicePixelRatio,1.7)
);

garageRenderer.setSize(
innerWidth,
innerHeight
);

garageRenderer.shadowMap.enabled=true;

garageRenderer.shadowMap.type=
THREE.PCFSoftShadowMap;

/* =====================================================
   RACE LOOP
===================================================== */

function raceLoop(){

if(!$("race").classList.contains("active"))
return;


if(!raceRunning){

if(raceRenderer)
raceRenderer.render(
raceScene,
raceCamera
);

requestAnimationFrame(raceLoop);

return;

}


const car=
CARS[currentCar];


const maxSpeed=
18+car.top*.11;

const acceleration=
.015+car.acc*.00007;

const handling=
.055+car.hand*.00035;


/* STEERING */

if(leftPressed)
playerX-=handling;

if(rightPressed)
playerX+=handling;

playerX=
Math.max(
-5.4,
Math.min(5.4,playerX)
);


/* SPEED */

if(nitroPressed&&playerNitro>0){

playerSpeed+=.14;

playerNitro-=.85;

}

else{

playerSpeed+=acceleration;

if(playerNitro<100)
playerNitro+=.12;

}


playerSpeed=
Math.min(
maxSpeed,
playerSpeed
);


/* MOVEMENT */

playerDistance+=
playerSpeed*.075;


/* CAR MOVEMENT */

raceCar.position.x=
playerX;

raceCar.rotation.z=
-playerX*.025;

raceCar.rotation.y=
-playerX*.018;


/* CAMERA */

raceCamera.position.x+=
(playerX*.45-raceCamera.position.x)*.08;

raceCamera.position.y=
4.2;

raceCamera.position.z=
-9;

raceCamera.lookAt(
playerX*.25,
.8,
12
);


/* TRAFFIC */

trafficCars.forEach(car=>{

car.position.z-=
playerSpeed*.9+
car.userData.speed;


/* recycle */

if(car.position.z<-25){

const lanes=[
-4.6,
-2.3,
2.3,
4.6
];

car.position.x=
lanes[
Math.floor(Math.random()*lanes.length)
];

car.position.z=
230+Math.random()*100;

}


/* collision */

if(
Math.abs(
car.position.x-playerX
)<1.55&&
Math.abs(
car.position.z-raceCar.position.z
)<3
){

playerSpeed*=.45;

car.position.z+=6;

playCrash();

}

});


/* UI */

$("speed").textContent=
Math.floor(playerSpeed*18);

$("distance").textContent=
`${Math.floor(playerDistance)}M / 3000M`;

const elapsed=
performance.now()-raceStartTime;

const seconds=
Math.floor(elapsed/1000);

const minutes=
Math.floor(seconds/60);

const secs=
seconds%60;

$("timer").textContent=
`${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

$("nitroBar").style.width=
playerNitro+"%";


updateEngine(playerSpeed);


/* FINISH */

if(playerDistance>=3000){

raceRunning=false;

$("finish").classList.add("show");

$("finishInfo").textContent=
`TIME ${$("timer").textContent} • ${CARS[currentCar].name} • ${Math.floor(playerSpeed*18)} KM/H`;

playWin();

stopEngine();

return;

}


raceRenderer.render(
raceScene,
raceCamera
);

requestAnimationFrame(raceLoop);

}

/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

if(audioContext)
return;

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}


function tone(
frequency,
duration,
volume=.15
){

if(!audioContext)
return;

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.frequency.value=
frequency;

gain.gain.setValueAtTime(
volume,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.001,
audioContext.currentTime+duration
);

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.start();

osc.stop(
audioContext.currentTime+duration
);

}


function playSelect(){

tone(650,.13,.12);

}


function playCountdown(){

tone(420,.18,.18);

}


function playGo(){

tone(900,.35,.25);

}


function playCrash(){

tone(90,.35,.25);

}


function playWin(){

[523,659,784,1046].forEach(
(f,i)=>{

setTimeout(
()=>tone(f,.25,.2),
i*150
);

});

}


/* ENGINE */

function updateEngine(speed){

if(!audioContext||!musicEnabled)
return;

if(!engineOsc){

engineOsc=
audioContext.createOscillator();

engineGain=
audioContext.createGain();

engineOsc.type="sawtooth";

engineGain.gain.value=0;

const filter=
audioContext.createBiquadFilter();

filter.type="lowpass";

filter.frequency.value=700;

engineOsc
.connect(filter)
.connect(engineGain)
.connect(audioContext.destination);

engineOsc.start();

}

engineOsc.frequency.value=
75+speed*13+
(nitroPressed?55:0);

engineGain.gain.setTargetAtTime(
.045+speed*.004,
audioContext.currentTime,
.08
);

}


function stopEngine(){

if(engineGain){

engineGain.gain.setTargetAtTime(
0,
audioContext.currentTime,
.15
);

}

}

/* =====================================================
   TOUCH + KEYBOARD
===================================================== */

function bindControl(
element,
down,
up
){

element.addEventListener(
"touchstart",
e=>{
e.preventDefault();
down();
},
{passive:false}
);

element.addEventListener(
"touchend",
e=>{
e.preventDefault();
up();
},
{passive:false}
);

element.addEventListener(
"mousedown",
down
);

element.addEventListener(
"mouseup",
up
);

element.addEventListener(
"mouseleave",
up
);

}


bindControl(
$("leftBtn"),
()=>leftPressed=true,
()=>leftPressed=false
);

bindControl(
$("rightBtn"),
()=>rightPressed=true,
()=>rightPressed=false
);

bindControl(
$("nitroBtn"),
()=>nitroPressed=true,
()=>nitroPressed=false
);


addEventListener(
"keydown",
e=>{

if(
e.key==="ArrowLeft"||
e.key.toLowerCase()==="a"
)
leftPressed=true;

if(
e.key==="ArrowRight"||
e.key.toLowerCase()==="d"
)
rightPressed=true;

if(
e.key===" "||
e.key==="Shift"
)
nitroPressed=true;

});


addEventListener(
"keyup",
e=>{

if(
e.key==="ArrowLeft"||
e.key.toLowerCase()==="a"
)
leftPressed=false;

if(
e.key==="ArrowRight"||
e.key.toLowerCase()==="d"
)
rightPressed=false;

if(
e.key===" "||
e.key==="Shift"
)
nitroPressed=false;

});


/* =====================================================
   GARAGE MOUSE ROTATION
===================================================== */

$("garageCanvas").addEventListener(
"mousedown",
e=>{

mouseDown=true;

lastMouseX=e.clientX;

});


addEventListener(
"mouseup",
()=>mouseDown=false
);


addEventListener(
"mousemove",
e=>{

if(!mouseDown||!garageCar)
return;

const difference=
e.clientX-lastMouseX;

targetRotation+=
difference*.012;

lastMouseX=e.clientX;

});


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
"resize",
()=>{

if(
garageCamera&&
garageRenderer
){

garageCamera.aspect=
innerWidth/innerHeight;

garageCamera.updateProjectionMatrix();

garageRenderer.setSize(
innerWidth,
innerHeight
);

}


if(
raceCamera&&
raceRenderer
){

raceCamera.aspect=
innerWidth/innerHeight;

raceCamera.updateProjectionMatrix();

raceRenderer.setSize(
innerWidth,
innerHeight
);

}

});


/* =====================================================
   INITIAL STATE
===================================================== */

/*
  IMPORTANT:
  We DO NOT call updateGarageUI() here.

  The old version called ui() before Three.js
  created the scene, which could crash the game.

  Everything starts after ENTER THE GARAGE.
*/
