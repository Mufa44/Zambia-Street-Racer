<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZAMBIA STREET RACER</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020604;color:#fff;font-family:Arial,sans-serif}

#intro{
position:fixed;inset:0;z-index:100;
display:flex;align-items:center;justify-content:center;
background:
radial-gradient(circle at 50% 30%,rgba(22,214,107,.18),transparent 45%),
linear-gradient(180deg,#020604,#000);
transition:1s
}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}

.hero{text-align:center;padding:25px}
.badge{
display:inline-block;padding:8px 15px;border:1px solid #16d66b;
border-radius:30px;color:#8fdcab;font-size:10px;
letter-spacing:3px;margin-bottom:20px
}
.hero h1{
font-size:clamp(45px,10vw,100px);
line-height:.88;letter-spacing:6px;font-weight:900
}
.hero h1 span{
color:#16d66b;
text-shadow:0 0 35px rgba(22,214,107,.7)
}
.hero p{
margin-top:18px;color:#8fa89a;
font-size:11px;letter-spacing:4px
}
.btn{
margin-top:30px;padding:17px 48px;
border:0;background:#16d66b;color:#00150a;
font-weight:900;letter-spacing:3px;
cursor:pointer;border-radius:4px;
box-shadow:0 0 40px rgba(22,214,107,.4)
}

#garage{
position:fixed;inset:0;
opacity:0;visibility:hidden;
transition:1s
}
#garage.show{opacity:1;visibility:visible}

#garageCanvas{
position:absolute;inset:0;
width:100%;height:100%;
display:block;z-index:1
}

.ui{
position:absolute;z-index:10;
top:0;left:0;right:0;height:64px;
display:flex;align-items:center;
justify-content:space-between;
padding:0 20px;
background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)
}
.ui b{font-size:13px;letter-spacing:2px}
.ui b span{color:#16d66b}

.panel{
position:absolute;
z-index:20;
left:20px;
top:76px;
width:350px;
padding:20px;
background:rgba(5,12,8,.88);
border:1px solid rgba(255,255,255,.1);
border-left:3px solid #16d66b;
backdrop-filter:blur(18px);
border-radius:0 16px 16px 0;
box-shadow:0 20px 60px rgba(0,0,0,.65)
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px
}
.row button{
width:40px;height:40px;
border-radius:10px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.06);
color:#fff;font-size:22px
}

#name{font-size:25px;font-weight:900}
.sub{
font-size:11px;color:#16d66b;
letter-spacing:2px;font-weight:bold
}
.meta{
font-size:10px;color:#819589;
letter-spacing:1px;margin-top:4px
}

.stat{margin-top:10px}
.l{
display:flex;
justify-content:space-between;
font-size:9px;
color:#9bb0a4;
margin-bottom:4px
}
.track{
height:4px;
background:rgba(255,255,255,.08);
border-radius:10px;
overflow:hidden
}
.fill{
height:100%;
background:linear-gradient(90deg,#087c3c,#16d66b);
box-shadow:0 0 10px #16d66b
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:12px;
max-height:82px;
overflow:auto
}
.grid button{
padding:7px;
border-radius:8px;
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
color:#91a399;
font-size:8px
}
.grid button.on{
background:#16d66b;
color:#00150a;
font-weight:900
}

.primary{
width:100%;
margin-top:12px;
padding:14px;
border:0;
border-radius:10px;
background:#16d66b;
color:#00150a;
font-weight:900;
letter-spacing:2px;
box-shadow:0 0 30px rgba(22,214,107,.35)
}

.ghost{
position:absolute;
z-index:25;
right:18px;
bottom:18px;
padding:10px 16px;
border-radius:20px;
border:1px solid rgba(255,255,255,.15);
background:rgba(0,0,0,.6);
color:#fff
}

/* RACE */

#race{
position:fixed;inset:0;
z-index:200;
display:none;
background:#050912
}
#race.on{display:block}

#raceCanvas{
position:absolute;inset:0;
width:100%;height:100%
}

#raceUI{
position:absolute;inset:0;
display:flex;
flex-direction:column;
justify-content:space-between;
pointer-events:none
}

.top{
padding:15px;
display:flex;
justify-content:space-between;
font-size:11px;
letter-spacing:2px;
background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)
}

.bottom{
padding:15px;
background:linear-gradient(0deg,rgba(0,0,0,.95),transparent);
pointer-events:auto
}

.speed{font-size:38px;font-weight:900}
.speed i{font-size:12px;color:#8aa090;font-style:normal}

.bar{
height:6px;
background:rgba(255,255,255,.1);
border-radius:10px;
overflow:hidden;
margin:8px 0
}
#nitro{
height:100%;
width:100%;
background:#16d66b;
box-shadow:0 0 15px #16d66b
}

.ctrl{
display:grid;
grid-template-columns:1fr 1.4fr 1fr;
gap:10px
}
.ctrl button{
padding:18px;
border-radius:14px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.07);
color:#fff;font-weight:900
}
#nitroBtn{
background:#16d66b;
color:#00150a
}

#countdown{
position:absolute;
top:45%;left:50%;
transform:translate(-50%,-50%);
font-size:90px;
font-weight:900;
text-shadow:0 0 35px #fff
}

#finish{
position:absolute;inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(0,0,0,.9)
}
#finish.on{display:flex}
#finish h2{
font-size:55px;
color:#16d66b;
letter-spacing:5px
}

/* MOBILE */

@media(max-width:700px){

.ui{
height:58px;
padding:0 13px
}

.ui b{font-size:10px}

.panel{
left:8px;
right:8px;
top:auto;
bottom:0;
width:auto;
height:42vh;
min-height:300px;
max-height:365px;
padding:13px;
border-left:2px solid #16d66b;
border-radius:18px 18px 0 0;
background:rgba(4,11,7,.94)
}

#name{font-size:21px}

.grid{
max-height:48px;
margin-top:7px
}

.grid button{
padding:5px;
font-size:7px
}

.stat{margin-top:6px}

.primary{
margin-top:8px;
padding:11px
}

.ghost{
top:62px;
bottom:auto;
right:10px;
padding:8px 12px
}
}
</style>
</head>

},

{

}

/* =========================
   VARIABLES
========================= */

let cur=0;

let scene;
let camera;
let renderer;
let carGroup;

let garageReady=false;

let targetRotation=-0.35;
let currentRotation=-0.35;

let mouseX=0;
let dragging=false;
let lastX=0;

let rScene;
let rCam;
let rRend;
let rCar;

let traffic=[];

let active=false;
let carX=0;
let spd=0;
let nitro=100;
let dist=0;
let startTime=0;

let left=false;
let right=false;
let boost=false;

let audioContext;
let music=false;
let backgroundMusic;

/* =========================
   HELPER
========================= */

const $=id=>document.getElementById(id);

/* =========================
   ENTER GARAGE
========================= */

window.enterGarage=()=>{

$("intro").classList.add("hide");

setTimeout(()=>{

$("garage").classList.add("show");

initGarage();

updateGarage();

},500);

};

/* =========================
   GARAGE
========================= */

function initGarage(){

if(garageReady)return;

garageReady=true;

scene=new THREE.Scene();

scene.background=new THREE.Color(0x020604);

scene.fog=new THREE.Fog(
0x020604,
12,
35
);

camera=new THREE.PerspectiveCamera(
40,
innerWidth/innerHeight,
0.1,
100
);

if(innerWidth<=700){

camera.position.set(
4.8,
2.7,
8.5
);

}else{

camera.position.set(
4.8,
2.3,
7.5
);

}

renderer=new THREE.WebGLRenderer({
canvas:$("garageCanvas"),
antialias:true,
alpha:true
});

renderer.setPixelRatio(
Math.min(devicePixelRatio,2)
);

renderer.setSize(
innerWidth,
innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.35;

/* FLOOR */

const floor=new THREE.Mesh(

new THREE.PlaneGeometry(60,60),

new THREE.MeshStandardMaterial({

color:0x050807,

roughness:.18,

metalness:.75

})

);

floor.rotation.x=-Math.PI/2;

floor.receiveShadow=true;

scene.add(floor);

/* GREEN LIGHT */

const green=new THREE.PointLight(
0x00ff66,
35,
20
);

green.position.set(
-5,
4,
3
);

scene.add(green);

/* WHITE KEY LIGHT */

const key=new THREE.DirectionalLight(
0xffffff,
5
);

key.position.set(
4,
8,
7
);

key.castShadow=true;

key.shadow.mapSize.width=2048;

key.shadow.mapSize.height=2048;

scene.add(key);

/* BACK LIGHT */

const rim=new THREE.PointLight(
0x16d66b,
20,
18
);

rim.position.set(
0,
4,
-4
);

scene.add(rim);

/* AMBIENT */

scene.add(
new THREE.HemisphereLight(
0x9bb9a8,
0x020604,
1.2
)
);

/* BACK WALL */

const wall=new THREE.Mesh(

new THREE.BoxGeometry(
32,
14,
.4
),

new THREE.MeshStandardMaterial({
color:0x030805,
roughness:.8
})

);

wall.position.set(
0,
6,
-5
);

scene.add(wall);

/* FLOOR GLOW */

const glow=new THREE.Mesh(

new THREE.CircleGeometry(4.5,64),

new THREE.MeshBasicMaterial({
color:0x16d66b,
transparent:true,
opacity:.045
})

);

glow.rotation.x=-Math.PI/2;

glow.position.y=.01;

scene.add(glow);

/* BUILD CAR */

buildCar(CARS[cur]);

/* MOUSE */

$("garageCanvas").addEventListener(
"mousedown",
e=>{
dragging=true;
lastX=e.clientX;
}
);

addEventListener(
"mouseup",
()=>{
dragging=false;
}
);

addEventListener(
"mousemove",
e=>{

if(dragging){

targetRotation+=
(e.clientX-lastX)*.01;

lastX=e.clientX;

}

mouseX=
(e.clientX/innerWidth-.5);

}
);

/* TOUCH */

$("garageCanvas").addEventListener(
"touchstart",
e=>{
dragging=true;
lastX=e.touches[0].clientX;
},
{passive:false}
);

addEventListener(
"touchend",
()=>{
dragging=false;
}
);

addEventListener(
"touchmove",
e=>{

if(dragging){

targetRotation+=
(e.touches[0].clientX-lastX)*.01;

lastX=e.touches[0].clientX;

}

},
{passive:false}
);

/* RESIZE */

addEventListener(
"resize",
resizeAll
);

garageLoop();

}

/* =========================
   BUILD CAR
========================= */

function buildCar(d){

if(carGroup)
scene.remove(carGroup);

carGroup=new THREE.Group();

/* PAINT */

const paint=new THREE.MeshPhysicalMaterial({

color:d.color,

metalness:.92,

roughness:.14,

clearcoat:1,

clearcoatRoughness:.06

});

/* BLACK */

const black=new THREE.MeshPhysicalMaterial({

color:0x050505,

metalness:.2,

roughness:.5

});

/* BODY */

let L=
d.shape==="hatch"?3.8:
d.shape==="coupe"?4.4:
d.shape==="pickup"?5.1:
4.8;

let W=
d.shape==="pickup"?2.2:2.0;

const bodyShape=new THREE.Shape();

bodyShape.moveTo(
-L/2+.3,
-W/2
);

bodyShape.lineTo(
L/2-.3,
-W/2
);

bodyShape.quadraticCurveTo(
L/2,
-W/2,
L/2,
-W/2+.3
);

bodyShape.lineTo(
L/2,
W/2-.3
);

bodyShape.quadraticCurveTo(
L/2,
W/2,
L/2-.3,
W/2
);

bodyShape.lineTo(
-L/2+.3,
W/2
);

bodyShape.quadraticCurveTo(
-L/2,
W/2,
-L/2,
W/2-.3
);

bodyShape.lineTo(
-L/2,
-W/2+.3
);

bodyShape.quadraticCurveTo(
-L/2,
-W/2,
-L/2+.3,
-W/2
);

const bodyGeo=new THREE.ExtrudeGeometry(
bodyShape,
{
depth:.62,
bevelEnabled:true,
bevelThickness:.1,
bevelSize:.09,
bevelSegments:5
}
);

bodyGeo.rotateY(Math.PI/2);

bodyGeo.translate(
0,
.55,
0
);

const body=new THREE.Mesh(
bodyGeo,
paint
);

body.castShadow=true;

body.receiveShadow=true;

carGroup.add(body);

/* ROOF */

if(d.shape!=="pickup"){

const roof=new THREE.Mesh(

new THREE.BoxGeometry(
d.shape==="hatch"?1.55:2,
.52,
1.65
),

black

);

roof.position.set(
d.shape==="hatch"?-.25:-.15,
1.28,
0
);

roof.scale.y=1;

roof.castShadow=true;

carGroup.add(roof);

}

/* PICKUP BED */

if(d.shape==="pickup"){

const bed=new THREE.Mesh(

new THREE.BoxGeometry(
2,
.55,
2
),

paint

);

bed.position.set(
-L/2+1,
1.05,
0
);

carGroup.add(bed);

}

/* WINDOWS */

if(d.shape!=="pickup"){

const windshield=new THREE.Mesh(

new THREE.BoxGeometry(
.05,
.32,
1.45
),

new THREE.MeshPhysicalMaterial({
color:0x07130f,
metalness:.2,
roughness:.1,
transparent:true,
opacity:.9
})

);

windshield.position.set(
.78,
1.38,
0
);

carGroup.add(windshield);

}

/* WHEELS */

const wheelPositions=[

[L/2-.75,.38,W/2-.04],

[L/2-.75,.38,-W/2+.04],

[-L/2+.95,.38,W/2-.04],

[-L/2+.95,.38,-W/2+.04]

];

wheelPositions.forEach(
p=>{

const wheel=new THREE.Group();

const tire=new THREE.Mesh(

new THREE.TorusGeometry(
d.shape==="pickup"?.52:.43,
.15,
16,
32
),

new THREE.MeshStandardMaterial({
color:0x050505,
roughness:.9
})

);

tire.rotation.y=Math.PI/2;

tire.castShadow=true;

wheel.add(tire);

const rim=new THREE.Mesh(

new THREE.CylinderGeometry(
.3,
.3,
.23,
16
),

new THREE.MeshStandardMaterial({
color:0xdde4e0,
metalness:1,
roughness:.15
})

);

rim.rotation.z=Math.PI/2;

wheel.add(rim);

wheel.position.set(
p[0],
p[1],
p[2]
);

carGroup.add(wheel);

}
);

/* HEADLIGHTS */

for(const z of[-.62,.62]){

const light=new THREE.Mesh(

new THREE.BoxGeometry(
.12,
.18,
.42
),

new THREE.MeshStandardMaterial({

color:0xffffff,

emissive:0xffffff,

emissiveIntensity:5

})

);

light.position.set(
L/2+.03,
.85,
z
);

carGroup.add(light);

}

/* TAIL LIGHTS */

for(const z of[-.65,.65]){

const light=new THREE.Mesh(

new THREE.BoxGeometry(
.12,
.16,
.35
),

new THREE.MeshStandardMaterial({

color:0xff0000,

emissive:0xff0000,

emissiveIntensity:4

})

);

light.position.set(
-L/2-.03,
.82,
z
);

carGroup.add(light);

}

/* SPOILER */

if(
d.name.includes("MARK X")||
d.name.includes("SUPRA")||
d.name.includes("BMW")
){

const spoiler=new THREE.Mesh(

new THREE.BoxGeometry(
.25,
.07,
1.8
),

black

);

spoiler.position.set(
-L/2-.12,
1.45,
0
);

carGroup.add(spoiler);

}

/* CAR POSITION */

carGroup.position.set(
0,
.18,
.8
);

if(innerWidth<=700){

carGroup.scale.set(
1.55,
1.55,
1.55
);

}else{

carGroup.scale.set(
1.35,
1.35,
1.35
);

}

carGroup.rotation.y=targetRotation;

scene.add(carGroup);

}

/* =========================
   GARAGE LOOP
========================= */

function garageLoop(){

requestAnimationFrame(
garageLoop
);

if(!renderer||!scene)return;

currentRotation+=
(targetRotation-currentRotation)*.08;

if(carGroup){

carGroup.rotation.y=
currentRotation;

carGroup.position.y=
.18+
Math.sin(Date.now()*.0014)*.012;

}

if(innerWidth<=700){

camera.position.x=
4.8+mouseX*.8;

camera.lookAt(
0,
.95,
.6
);

}else{

camera.position.x=
4.8+mouseX*1.1;

camera.lookAt(
0,
1.15,
.4
);

}

if($("garage").classList.contains("show")){

renderer.render(
scene,
camera
);

}

}

/* =========================
   GARAGE UI
========================= */

function updateGarage(){

const c=CARS[cur];

$("name").textContent=c.name;

$("type").textContent=c.type;

$("year").textContent=c.year;

$("cnt").textContent=
`${cur+1} / ${CARS.length}`;

$("stats").innerHTML=`

<div class="stat">
<div class="l">
<span>TOP SPEED</span>
<span>${c.top}%</span>
</div>
<div class="track">
<div class="fill" style="width:${c.top}%"></div>
</div>
</div>

<div class="stat">
<div class="l">
<span>ACCELERATION</span>
<span>${c.acc}%</span>
</div>
<div class="track">
<div class="fill" style="width:${c.acc}%"></div>
</div>
</div>

<div class="stat">
<div class="l">
<span>HANDLING</span>
<span>${c.hand}%</span>
</div>
<div class="track">
<div class="fill" style="width:${c.hand}%"></div>
</div>
</div>
`;

$("grid").innerHTML=
CARS.map(
(x,i)=>
`<button class="${
i===cur?"on":""
}" onclick="selectCar(${i})">${x.name}</button>`
).join("");

if(scene)
buildCar(c);

}

/* CAR SELECT */

window.selectCar=i=>{

cur=i;

updateGarage();

beep(650);

};

window.nextCar=()=>{

cur=(cur+1)%CARS.length;

updateGarage();

beep(650);

};

window.prevCar=()=>{

cur=(cur-1+CARS.length)%CARS.length;

updateGarage();

beep(650);

};

/* =========================
   RACE
========================= */

function initRace(){

rScene=new THREE.Scene();

rScene.background=
new THREE.Color(0x050912);

rScene.fog=
new THREE.Fog(
0x050912,
20,
100
);

rCam=new THREE.PerspectiveCamera(
62,
innerWidth/innerHeight,
.1,
200
);

rCam.position.set(
0,
4.2,
-7.5
);

rRend=new THREE.WebGLRenderer({
canvas:$("raceCanvas"),
antialias:true
});

rRend.setPixelRatio(
Math.min(devicePixelRatio,1.5)
);

rRend.setSize(
innerWidth,
innerHeight
);

rRend.shadowMap.enabled=true;

rScene.add(
new THREE.HemisphereLight(
0x8aa0a8,
0x020604,
1.2
)
);

const sun=new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(
10,
18,
6
);

sun.castShadow=true;

rScene.add(sun);

/* ROAD */

const road=new THREE.Mesh(

new THREE.PlaneGeometry(
14,
600
),

new THREE.MeshStandardMaterial({
color:0x171c20,
roughness:.85
})

);

road.rotation.x=-Math.PI/2;

road.position.z=250;

road.receiveShadow=true;

rScene.add(road);

/* ROAD LINES */

for(
let z=-300;
z<600;
z+=8
){

const line=new THREE.Mesh(

new THREE.PlaneGeometry(
.35,
3
),

new THREE.MeshBasicMaterial({
color:0xffffff
})

);

line.rotation.x=-Math.PI/2;

line.position.set(
0,
.02,
z
);

rScene.add(line);

}

/* CITY */

for(
const side of[-1,1]
){

for(
let z=-250;
z<600;
z+=12
){

const h=
2+
Math.random()*8;

const building=new THREE.Mesh(

new THREE.BoxGeometry(
4+Math.random()*3,
h,
7
),

new THREE.MeshStandardMaterial({
color:0x11191a,
roughness:.9
})

);

building.position.set(
side*(10+Math.random()*6),
h/2,
z
);

rScene.add(building);

}

}

/* PLAYER */

const c=CARS[cur];

const paint=
new THREE.MeshPhysicalMaterial({
color:c.color,
metalness:.9,
roughness:.18,
clearcoat:1
});

rCar=new THREE.Group();

const body=
new THREE.Mesh(
new THREE.BoxGeometry(
1.85,
.5,
4.1
),
paint
);

body.position.y=.58;

body.castShadow=true;

rCar.add(body);

const roof=
new THREE.Mesh(
new THREE.BoxGeometry(
1.55,
.45,
1.7
),
new THREE.MeshStandardMaterial({
color:0x080808
})
);

roof.position.set(
0,
.96,
-.2
);

rCar.add(roof);

rCar.position.set(
0,
.28,
-2
);

rScene.add(rCar);

/* TRAFFIC */

traffic=[];

for(
let i=0;
i<10;
i++
){

const trafficCar=
new THREE.Mesh(

new THREE.BoxGeometry(
1.8,
.75,
3.6
),

new THREE.MeshStandardMaterial({
color:
[0x222222,
0xffffff,
0x555555,
0x990000][i%4]
})

);

trafficCar.position.set(
(Math.random()-.5)*9,
.5,
40+Math.random()*260
);

trafficCar.userData.speed=
.5+Math.random()*.8;

rScene.add(trafficCar);

traffic.push(trafficCar);

}

}

/* START */

window.startRace=()=>{

if(!rScene)
initRace();

$("race").classList.add("on");

$("rName").textContent=
CARS[cur].name;

$("finish").classList.remove("on");

active=false;

carX=0;
spd=0;
nitro=100;
dist=0;

let count=3;

$("countdown").style.display="block";

$("countdown").textContent=count;

beep(440);

const timer=setInterval(()=>{

count--;

if(count>0){

$("countdown").textContent=count;

beep(440);

}

else if(count===0){

$("countdown").textContent="GO!";

beep(900);

}

else{

clearInterval(timer);

$("countdown").style.display="none";

active=true;

startTime=Date.now();

}

},700);

requestAnimationFrame(raceLoop);

};

/* RACE LOOP */

function raceLoop(){

if(!$("race").classList.contains("on"))
return;

if(!active){

rRend.render(
rScene,
rCam
);

requestAnimationFrame(raceLoop);

return;

}

const c=CARS[cur];

const max=17+c.top/6;

const acceleration=
c.acc/1200;

const handling=
c.hand/110;

if(left)
carX-=.17*handling;

if(right)
carX+=.17*handling;

carX=
Math.max(
-5.6,
Math.min(5.6,carX)
);

carX*=.96;

if(boost&&nitro>0){

spd=
Math.min(
max*1.55,
spd+.26
);

nitro-=.85;

}else{

spd=
Math.min(
max,
spd+acceleration
);

if(nitro<100)
nitro+=.16;

}

dist+=spd*.06;

rCar.position.x=carX;

rCar.rotation.z=
-carX*.07;

rCam.position.x=
carX*.55;

rCam.lookAt(
carX*.3,
.8,
14
);

traffic.forEach(t=>{

t.position.z-=
spd*.9+t.userData.speed;

if(t.position.z<-20){

t.position.z=
230+Math.random()*100;

t.position.x=
(Math.random()-.5)*9;

}

if(
Math.abs(t.position.x-carX)<1.55&&
Math.abs(t.position.z-rCar.position.z)<2.8
){

spd*=.45;

beep(120);

}

});

$("spd").textContent=
Math.floor(spd*18);

$("rDist").textContent=
`${Math.floor(dist)} / 3000M`;

$("rTime").textContent=
new Date(
Date.now()-startTime
).toISOString().substr(14,5);

$("nitro").style.width=
nitro+"%";

if(dist>=3000){

active=false;

$("finish").classList.add("on");

$("fTime").textContent=
`Time: ${$("rTime").textContent} • ${c.name}`;

win();

}else{

rRend.render(
rScene,
rCam
);

requestAnimationFrame(raceLoop);

}

}

/* =========================
   CONTROLS
========================= */

function bindButton(el,down,up){

el.addEventListener(
"touchstart",
e=>{
e.preventDefault();
down();
},
{passive:false}
);

el.addEventListener(
"touchend",
up
);

el.addEventListener(
"mousedown",
down
);

el.addEventListener(
"mouseup",
up
);

el.addEventListener(
"mouseleave",
up
);

}

bindButton(
$("lBtn"),
()=>left=true,
()=>left=false
);

bindButton(
$("rBtn"),
()=>right=true,
()=>right=false
);

bindButton(
$("nitroBtn"),
()=>boost=true,
()=>boost=false
);

addEventListener(
"keydown",
e=>{

if(e.key==="ArrowLeft"||e.key==="a")
left=true;

if(e.key==="ArrowRight"||e.key==="d")
right=true;

if(e.key===" "||e.key==="Shift")
boost=true;

}
);

addEventListener(
"keyup",
e=>{

if(e.key==="ArrowLeft"||e.key==="a")
left=false;

if(e.key==="ArrowRight"||e.key==="d")
right=false;

if(e.key===" "||e.key==="Shift")
boost=false;

}
);

/* =========================
   AUDIO
========================= */

function initAudio(){

if(audioContext)return;

audioContext=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

function beep(freq){

if(!audioContext)return;

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.frequency.value=freq;

gain.gain.setValueAtTime(
.16,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.01,
audioContext.currentTime+.18
);

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.start();

osc.stop(
audioContext.currentTime+.18
);

}

function win(){

[523,659,784,1046].forEach(
(freq,i)=>{

if(!audioContext)return;

const osc=
audioContext.createOscillator();

const gain=
audioContext.createGain();

osc.frequency.value=freq;

gain.gain.value=.15;

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.start(
audioContext.currentTime+i*.13
);

osc.stop(
audioContext.currentTime+i*.13+.25
);

}
);

}

/* MUSIC */

window.toggleMusic=()=>{

initAudio();

music=!music;

$("musicBtn").textContent=
music?
"🔊 MUSIC ON":
"🔇 MUSIC OFF";

if(music){

if(!backgroundMusic){

backgroundMusic=
new Audio(
"https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a650f6.mp3?filename=hip-hop-rock-beats-118000.mp3"
);

backgroundMusic.loop=true;

backgroundMusic.volume=.22;

}

backgroundMusic.play().catch(()=>{});

}else{

if(backgroundMusic)
backgroundMusic.pause();

}

};

/* RESIZE */

function resizeAll(){

if(renderer){

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

}

if(rRend){

rCam.aspect=
innerWidth/innerHeight;

rCam.updateProjectionMatrix();

rRend.setSize(
innerWidth,
innerHeight
);

}

}

/* RETURN */

window.returnGarage=()=>{

active=false;

$("race").classList.remove("on");

};

/* INITIAL UI */

updateGarage();

</script>
