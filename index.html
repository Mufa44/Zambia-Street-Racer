<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zambia Street Racer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020305;font-family:Arial,Helvetica,sans-serif;color:white}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at center,#12351f 0%,#06100b 38%,#010203 75%);transition:opacity 1.2s ease,visibility 1.2s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.logo{animation:logoIn 1.5s ease forwards}
.flag{font-size:52px;margin-bottom:15px}
.logo h1{font-size:clamp(38px,8vw,88px);letter-spacing:8px;font-weight:900;text-shadow:0 0 15px rgba(0,255,100,.5),0 0 50px rgba(0,255,100,.25)}
.logo .line{width:240px;height:3px;margin:18px auto;background:linear-gradient(90deg,transparent,#16d66b,transparent)}
.logo p{color:#aebbb3;letter-spacing:5px;font-size:13px}
.enter{margin-top:45px;padding:17px 48px;border:1px solid #20df76;background:rgba(10,40,23,.7);color:white;font-weight:bold;letter-spacing:3px;cursor:pointer;transition:.3s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.enter:hover{background:#13b85d;box-shadow:0 0 35px rgba(20,220,100,.45);transform:scale(1.04)}
@keyframes logoIn{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
#garage{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity 1s ease;background:#050708}
#garage.show{opacity:1;visibility:visible}
#scene{position:absolute;inset:0}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;height:78px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:linear-gradient(180deg,rgba(0,0,0,.85),rgba(0,0,0,0));pointer-events:none}
.brand{font-size:18px;font-weight:900;letter-spacing:3px}.brand span{color:#18db70}
.cash{pointer-events:auto;padding:10px 18px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.55);border-radius:4px;font-weight:bold}.cash span{color:#20e276}
.panel{position:absolute;z-index:5;top:100px;left:28px;width:310px;padding:24px;background:linear-gradient(135deg,rgba(7,12,10,.93),rgba(2,5,4,.82));border-left:3px solid #16d66b;box-shadow:0 15px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
.panel small{color:#7d8a82;letter-spacing:3px}.panel h2{margin:8px 0 3px;font-size:31px;letter-spacing:2px}.panel .sub{color:#9ba69f;font-size:12px;letter-spacing:2px}
.stats{margin-top:22px}.stat{margin-bottom:13px}.statRow{display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;color:#bbc5bf}
.bar{height:5px;background:#1a211e;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#087d3d,#24ed7b);box-shadow:0 0 10px rgba(25,230,110,.5)}
.actions{margin-top:25px;display:grid;gap:10px}.action{width:100%;padding:14px;background:#0b1711;color:white;border:1px solid #23432f;cursor:pointer;font-weight:bold;letter-spacing:2px;transition:.25s}.action:hover{border-color:#20df76;background:#102c1b}.action.primary{background:#0cbd5c;color:#00150a;border-color:#30ef83}.action.primary:hover{background:#20ed7a}
.bottom{position:absolute;z-index:5;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:10px;color:#89958e;font-size:11px;letter-spacing:2px;text-align:center}.hint{padding:9px 15px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1)}
.music{position:absolute;z-index:6;right:25px;bottom:25px;padding:12px 18px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);cursor:pointer;color:white}
@media(max-width:700px){.topbar{padding:0 15px}.panel{top:auto;bottom:70px;left:12px;right:12px;width:auto;padding:17px}.panel h2{font-size:24px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px 15px;margin-top:15px}.stat{margin:0}.actions{margin-top:14px;grid-template-columns:1fr 1fr}.action.primary{grid-column:span 2}.bottom{display:none}.music{top:85px;bottom:auto;right:15px}}
</style>
</head>
<body>
<section id="intro"><div class="logo"><div class="flag">🇿🇲</div><h1>ZAMBIA<br>STREET RACER</h1><div class="line"></div><p>THE STREETS ARE YOURS</p><button class="enter" onclick="enterGarage()">ENTER THE GARAGE</button></div></section>
<section id="garage">
  <div id="scene"></div>
  <div class="topbar"><div class="brand">ZAMBIA <span>STREET RACER</span></div><div class="cash">💰 K <span>5,000</span></div></div>
  <div class="panel"><small>SELECTED VEHICLE</small><h2>ZR-X MKII</h2><div class="sub">ZAMBIAN TUNED</div>
    <div class="stats">
      <div class="stat"><div class="statRow"><span>TOP SPEED</span><span>92%</span></div><div class="bar"><div class="fill" style="width:92%"></div></div></div>
      <div class="stat"><div class="statRow"><span>ACCELERATION</span><span>88%</span></div><div class="bar"><div class="fill" style="width:88%"></div></div></div>
      <div class="stat"><div class="statRow"><span>HANDLING</span><span>84%</span></div><div class="bar"><div class="fill" style="width:84%"></div></div></div>
      <div class="stat"><div class="statRow"><span>NITRO</span><span>76%</span></div><div class="bar"><div class="fill" style="width:76%"></div></div></div>
    </div>
    <div class="actions"><button class="action">CUSTOMIZE</button><button class="action">PERFORMANCE</button><button class="action primary" onclick="startRace()">🏁 START STREET RACE</button></div>
  </div>
  <div class="bottom"><div class="hint">🖱️ DRAG — LOOK AROUND</div><div class="hint">🖱️ SCROLL — ZOOM</div></div>
  <button class="music" onclick="toggleMusic()">🔇 MUSIC</button>
</section>

<script type="module">
import * as THREE from 'three';

let scene,camera,renderer,car;
let mouseX=0,mouseY=0,targetRotation=0,currentRotation=0;
let music=null;

window.enterGarage = function(){
  document.getElementById("intro").classList.add("hide");
  setTimeout(()=>{ document.getElementById("garage").classList.add("show"); init3D(); },500);
}

function init3D(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050708);
  scene.fog = new THREE.Fog(0x050708, 12, 38);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, .1, 100);
  camera.position.set(7, 3.8, 8);

  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.getElementById("scene").appendChild(renderer.domElement);

  // ENVIRONMENT MAP FOR REFLECTIONS - this is what makes it look real
  const loader = new THREE.TextureLoader();
  loader.load('https://threejs.org/examples/textures/equirectangular/pedestrian_overpass_1k.jpg', (tex)=>{
    tex.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = tex;
  });

  // LIGHTS
  scene.add(new THREE.HemisphereLight(0x8aa090, 0x050505, 0.8));
  
  const keyLight = new THREE.SpotLight(0xffffff, 400);
  keyLight.position.set(2,9,5);
  keyLight.angle=.6; keyLight.penumbra=.5; keyLight.castShadow=true;
  keyLight.shadow.mapSize.set(2048,2048);
  scene.add(keyLight);

  const greenLight = new THREE.PointLight(0x0aff70, 60, 18);
  greenLight.position.set(-7,3,1); scene.add(greenLight);
  const redLight = new THREE.PointLight(0xff241f, 40, 15);
  redLight.position.set(7,2,-5); scene.add(redLight);

  // FLOOR with reflection
  const floorMat = new THREE.MeshStandardMaterial({color:0x0a0e0d, roughness:0.15, metalness:0.8});
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60,60), floorMat);
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

  // Contact shadow under car
  const shadowTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/floors/FloorsCheckerboard_S_Diffuse.jpg');
  const shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(6,3),
    new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(createShadowCanvas()), transparent:true, opacity:0.6})
  );
  shadowPlane.rotation.x=-Math.PI/2; shadowPlane.position.y=0.02; shadowPlane.position.z=-1;
  scene.add(shadowPlane);

  createWallLogo();
  
  car = createRealCar();
  car.position.set(0,.15,-1);
  scene.add(car);

  window.addEventListener("mousemove", (e)=>{
    mouseX = (e.clientX/window.innerWidth-.5);
    mouseY = (e.clientY/window.innerHeight-.5);
    targetRotation = mouseX*.55;
  });
  window.addEventListener("wheel", (e)=>{
    camera.position.z += e.deltaY*0.01;
    camera.position.z = Math.max(4, Math.min(12, camera.position.z));
  });
  window.addEventListener("resize", ()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
}

function createShadowCanvas(){
  const c=document.createElement('canvas'); c.width=512; c.height=256;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(256,128,10,256,128,200);
  g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,512,256); return c;
}
