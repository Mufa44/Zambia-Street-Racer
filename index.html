<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🇿🇲 Zambia Street Racer V3</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#05070b;
  color:white;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#24345a 0%,#090d18 38%,#020305 75%);
}

/* MOON */
#moon{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 35px #fff;
  top:7%;
  right:12%;
  opacity:.9;
}

/* STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:.8;
}

/* CITY */
#city{
  position:absolute;
  bottom:40%;
  left:0;
  width:100%;
  height:30%;
  display:flex;
  align-items:flex-end;
  gap:5px;
  padding:0 3%;
}

.building{
  flex:1;
  min-width:25px;
  background:#090d15;
  border:1px solid #151d2b;
  position:relative;
}

.window{
  position:absolute;
  width:5px;
  height:7px;
  background:#ffd76a;
  box-shadow:0 0 5px #ffd76a;
}

/* ROAD */
#road{
  position:absolute;
  left:15%;
  width:70%;
  top:40%;
  height:65%;
  background:
    linear-gradient(
      90deg,
      #111 0%,
      #292929 4%,
      #202020 48%,
      #292929 96%,
      #111 100%
    );
  clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);
  overflow:hidden;
}

.roadEdge{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:#fff;
  box-shadow:0 0 10px #fff;
}

.roadEdge.left{left:34%}
.roadEdge.right{right:34%}

.lane{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0 45px,
    white 45px 100px
  );
  opacity:.8;
}

.lane.one{left:45%}
.lane.two{left:55%}

/* ROAD LIGHTS */
.streetLight{
  position:absolute;
  width:4px;
  height:150px;
  background:#151515;
  bottom:42%;
}

.streetLight:after{
  content:"";
  position:absolute;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#ffe98a;
  box-shadow:0 0 30px #ffe98a;
  top:-8px;
  left:-15px;
}

.streetLight.left{left:7%}
.streetLight.right{right:7%}

/* HUD */
#hud{
  position:absolute;
  z-index:20;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudBox{
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:8px 12px;
  backdrop-filter:blur(5px);
}

.label{
  font-size:10px;
  color:#aaa;
}

.value{
  font-size:20px;
  font-weight:bold;
}

/* PLAYER */
#player{
  position:absolute;
  z-index:15;
  width:58px;
  height:105px;
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
  transition:left .08s linear;
}

.carBody{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:16px 16px 10px 10px;
  background:linear-gradient(90deg,#151515,#d20b20,#ff3145,#a00012,#151515);
  box-shadow:
    0 0 15px #ff172f,
    inset 0 0 10px rgba(255,255,255,.25);
}

.carBody:before{
  content:"";
  position:absolute;
  width:35px;
  height:38px;
  top:13px;
  left:11px;
  border-radius:10px 10px 5px 5px;
  background:linear-gradient(#111,#52708a);
  border:2px solid #111;
}

.carBody:after{
  content:"";
  position:absolute;
  width:40px;
  height:8px;
  bottom:12px;
  left:9px;
  border-radius:50%;
  background:#ff152d;
  box-shadow:0 0 15px #ff152d;
}

/* ENEMY CARS */
.enemy{
  position:absolute;
  z-index:10;
  width:50px;
  height:90px;
  border-radius:14px;
  background:linear-gradient(90deg,#111,#267cff,#65a4ff,#111);
  box-shadow:0 0 12px #287cff;
}

.enemy:before{
  content:"";
  position:absolute;
  width:31px;
  height:32px;
  left:9px;
  top:12px;
  border-radius:8px;
  background:#182533;
}

.enemy:after{
  content:"";
  position:absolute;
  width:34px;
  height:7px;
  left:8px;
  bottom:10px;
  border-radius:50%;
  background:#ff2638;
  box-shadow:0 0 10px #ff2638;
}

/* ONCOMING */
.oncoming{
  background:linear-gradient(90deg,#111,#eee,#fff,#aaa,#111);
  box-shadow:0 0 12px #fff;
}

/* NITRO */
#nitroBar{
  position:absolute;
  z-index:25;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  height:13px;
  border:2px solid white;
  border-radius:10px;
  background:#111;
  overflow:hidden;
}

#nitroFill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00aaff,#00ffff);
  box-shadow:0 0 15px #00ffff;
}

/* CONTROLS */
.controls{
  position:absolute;
  z-index:30;
  bottom:50px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 20px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.control{
  width:65px;
  height:65px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.55);
  color:white;
  font-size:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:none;
}

.control:active{
  transform:scale(.92);
  background:rgba(255,255,255,.2);
}

#nitroBtn{
  width:75px;
  height:75px;
  border-color:#00d9ff;
  box-shadow:0 0 20px rgba(0,217,255,.4);
}

/* SPEED EFFECT */
.speedLine{
  position:absolute;
  z-index:8;
  width:3px;
  height:80px;
  background:white;
  opacity:0;
  animation:speed 0.35s linear infinite;
}

@keyframes speed{
  from{transform:translateY(-150px);opacity:0}
  40%{opacity:.8}
  to{transform:translateY(700px);opacity:0}
}

/* SCREENS */
.screen{
  position:absolute;
  z-index:100;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(2,4,8,.88);
  backdrop-filter:blur(6px);
}

.panel{
  width:min(90%,420px);
  padding:28px;
  text-align:center;
  border-radius:20px;
  background:linear-gradient(145deg,#111827,#080b11);
  border:1px solid #26354b;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
}

h1{
  margin:0 0 10px;
  font-size:32px;
}

h2{
  margin:8px 0;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.start{
  width:100%;
  background:#08a957;
  color:white;
  box-shadow:0 0 20px rgba(8,169,87,.35);
}

.small{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

#countdown{
  position:absolute;
  z-index:80;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:110px;
  font-weight:bold;
  text-shadow:0 0 30px #00ffff;
}

#message{
  font-size:18px;
  color:#bbb;
}

.hidden{
  display:none!important;
}

/* FLASH */
#flash{
  position:absolute;
  z-index:90;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

@media(max-width:600px){
  #road{
    left:5%;
    width:90%;
  }

  .roadEdge.left{left:34%}
  .roadEdge.right{right:34%}

  #player{
    width:50px;
    height:92px;
  }

  .enemy{
    width:44px;
    height:80px;
  }

  .streetLight{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="moon"></div>

  <div class="star" style="top:8%;left:12%"></div>
  <div class="star" style="top:15%;left:28%"></div>
  <div class="star" style="top:12%;left:48%"></div>
  <div class="star" style="top:22%;left:70%"></div>
  <div class="star" style="top:9%;left:83%"></div>
  <div class="star" style="top:27%;left:91%"></div>

  <div id="city"></div>

  <div class="streetLight left"></div>
  <div class="streetLight right"></div>

  <div id="road">
    <div class="roadEdge left"></div>
    <div class="roadEdge right"></div>
    <div class="lane one"></div>
    <div class="lane two"></div>
  </div>

  <div id="hud">
    <div class="hudBox">
      <div class="label">SPEED</div>
      <div class="value"><span id="speed">0</span> KM/H</div>
    </div>

    <div class="hudBox">
      <div class="label">RACE</div>
      <div class="value"><span id="distance">0</span>%</div>
    </div>

    <div class="hudBox">
      <div class="label">CASH</div>
      <div class="value">K<span id="money">500</span></div>
    </div>
  </div>

  <div id="player">
    <div class="carBody"></div>
  </div>

  <div id="nitroBar">
    <div id="nitroFill"></div>
  </div>

  <div class="controls">
    <div class="controlGroup">
      <div class="control" id="leftBtn">◀</div>
      <div class="control" id="rightBtn">▶</div>
    </div>

    <div class="control" id="nitroBtn">⚡</div>
  </div>

  <div id="countdown">3</div>

  <div id="flash"></div>

  <!-- START SCREEN -->
  <div class="screen" id="startScreen">
    <div class="panel">
      <div style="font-size:45px">🇿🇲🏎️</div>
      <h1>ZAMBIA STREET RACER</h1>
      <p class="small">
        Night streets. Traffic. Nitro.<br>
        Race your way through Zambia.
      </p>

      <h2>ZR-X</h2>
      <p class="small">
        TOP SPEED: 320 KM/H<br>
        HANDLING: 92<br>
        NITRO: 100%
      </p>

      <button class="start" onclick="startRace()">
        START STREET RACE
      </button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen hidden" id="resultScreen">
    <div class="panel">
      <div id="resultIcon" style="font-size:55px">🏁</div>
      <h1 id="resultTitle">RACE COMPLETE</h1>
      <p id="message">You made it.</p>
      <h2>K<span id="reward">0</span></h2>

      <button class="start" onclick="startRace()">
        RACE AGAIN
      </button>
    </div>
  </div>

</div>

<script>
/* =========================
   ZAMBIA STREET RACER V3
   ========================= */

const game = document.getElementById("game");
const player = document.getElementById("player");
const speedText = document.getElementById("speed");
const distanceText = document.getElementById("distance");
const moneyText = document.getElementById("money");
const nitroFill = document.getElementById("nitroFill");
const countdown = document.getElementById("countdown");
const startScreen = document.getElementById("startScreen");
const resultScreen = document.getElementById("resultScreen");
const resultTitle = document.getElementById("resultTitle");
const resultIcon = document.getElementById("resultIcon");
const message = document.getElementById("message");
const rewardText = document.getElementById("reward");
const flash = document.getElementById("flash");

let money = 500;

let playerX = 50;
let speed = 0;
let nitro = 100;
let distance = 0;

let raceRunning = false;
let countdownRunning = false;
let nitroPressed = false;

let enemies = [];
let roadSpeed = 7;
let spawnTimer = 0;

const lanes = [35,45,55,65];

/* CITY */
function createCity(){

  const city = document.getElementById("city");

  for(let i=0;i<28;i++){

    const building = document.createElement("div");
    building.className = "building";

    building.style.height =
      (40 + Math.random()*60) + "%";

    const windows =
      3 + Math.floor(Math.random()*5);

    for(let w=0;w<windows;w++){

      const win = document.createElement("div");
      win.className = "window";

      win.style.left =
        (10 + Math.random()*70) + "%";

      win.style.top =
        (10 + Math.random()*70) + "%";

      building.appendChild(win);
    }

    city.appendChild(building);
  }
}

createCity();

/* SPEED LINES */
function createSpeedLines(){

  for(let i=0;i<18;i++){

    const line=document.createElement("div");
    line.className="speedLine";

    line.style.left =
      (20+Math.random()*60)+"%";

    line.style.animationDelay =
      (Math.random()*1)+"s";

    game.appendChild(line);
  }
}

createSpeedLines();

/* START */
function startRace(){

  enemies.forEach(e=>e.el.remove());
  enemies=[];

  startScreen.classList.add("hidden");
  resultScreen.classList.add("hidden");

  playerX=50;
  speed=0;
  nitro=100;
  distance=0;
  spawnTimer=0;

  player.style.left=playerX+"%";

  countdownRunning=true;
  countdown.style.display="flex";

  let count=3;

  countdown.textContent=count;

  const timer=setInterval(()=>{

    count--;

    if(count>0){

      countdown.textContent=count;

    }else{

      countdown.textContent="GO!";

      setTimeout(()=>{
        countdown.style.display="none";
        countdownRunning=false;
        raceRunning=true;
      },600);

      clearInterval(timer);
    }

  },800);
}

/* CONTROLS */
let left=false;
let right=false;

function holdButton(element, direction){

  const start=()=>{
    if(direction==="left") left=true;
    if(direction==="right") right=true;
    if(direction==="nitro") nitroPressed=true;
  };

  const stop=()=>{
    if(direction==="left") left=false;
    if(direction==="right") right=false;
    if(direction==="nitro") nitroPressed=false;
  };

  element.addEventListener("touchstart",start,{passive:true});
  element.addEventListener("touchend",stop,{passive:true});
  element.addEventListener("touchcancel",stop,{passive:true});

  element.addEventListener("mousedown",start);
  element.addEventListener("mouseup",stop);
  element.addEventListener("mouseleave",stop);
}

holdButton(
  document.getElementById("leftBtn"),
  "left"
);

holdButton(
  document.getElementById("rightBtn"),
  "right"
);

holdButton(
  document.getElementById("nitroBtn"),
  "nitro"
);

/* KEYBOARD */
document.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key==="a")
    left=true;

  if(e.key==="ArrowRight" || e.key==="d")
    right=true;

  if(e.code==="Space")
    nitroPressed=true;
});

document.addEventListener("keyup",e=>{

  if(e.key==="ArrowLeft" || e.key==="a")
    left=false;

  if(e.key==="ArrowRight" || e.key==="d")
    right=false;

  if(e.code==="Space")
    nitroPressed=false;
});

/* SPAWN TRAFFIC */

function spawnCar(){

  const car=document.createElement("div");
  car.className="enemy";

  /*
   * IMPORTANT:
   * Enemy racers use the same direction as the player.
   * They start near the top and move downward toward
   * the player because the road/camera is moving.
   */

  const lane =
    lanes[Math.floor(Math.random()*lanes.length)];

  car.style.left=lane+"%";
  car.style.top="-120px";

  game.appendChild(car);

  enemies.push({
    el:car,
    x:lane,
    y:-120,
    speed:5+Math.random()*3,
    oncoming:false
  });
}

/* ONCOMING TRAFFIC */

function spawnOncoming(){

  const car=document.createElement("div");

  car.className="enemy oncoming";

  /*
   * Oncoming traffic stays in the opposite lanes.
   * It is visually separated from racing traffic.
   */

  const lane =
    Math.random()>0.5 ? 25 : 75;

  car.style.left=lane+"%";
  car.style.top="-120px";

  game.appendChild(car);

  enemies.push({
    el:car,
    x:lane,
    y:-120,
    speed:7+Math.random()*3,
    oncoming:true
  });
}

/* COLLISION */

function collision(a,b){

  const ar=a.getBoundingClientRect();
  const br=b.getBoundingClientRect();

  return !(
    ar.right<br.left ||
    ar.left>br.right ||
    ar.bottom<br.top ||
    ar.top>br.bottom
  );
}

/* CRASH */

function crash(){

  flash.style.opacity=".8";

  setTimeout(()=>{
    flash.style.opacity="0";
  },100);

  speed=20;

  navigator.vibrate?.(180);

  nitro=Math.max(0,nitro-15);
}

/* END */

function finishRace(win){

  raceRunning=false;

  let reward=win ? 1000 : 150;

  money+=reward;

  moneyText.textContent=money;
  rewardText.textContent=reward;

  if(win){

    resultIcon.textContent="🏆";
    resultTitle.textContent="YOU WON!";
    message.textContent=
      "You owned the streets tonight. 🇿🇲🔥";

  }else{

    resultIcon.textContent="💥";
    resultTitle.textContent="RACE OVER";
    message.textContent=
      "The streets got the better of you this time.";
  }

  resultScreen.classList.remove("hidden");
}

/* GAME LOOP */

let lastTime=performance.now();

function gameLoop(time){

  requestAnimationFrame(gameLoop);

  const delta=(time-lastTime)/16.67;
  lastTime=time;

  if(!raceRunning || countdownRunning)
    return;

  /* STEERING */

  if(left)
    playerX-=1.2*delta;

  if(right)
    playerX+=1.2*delta;

  playerX=Math.max(32,Math.min(68,playerX));

  player.style.left=playerX+"%";

  /* NITRO */

  let targetSpeed=150;

  if(nitroPressed && nitro>0){

    speed=320;

    nitro-=0.55*delta;

    targetSpeed=320;

  }else{

    speed+=
      (targetSpeed-speed)*0.04*delta;

    nitro+=0.12*delta;
  }

  nitro=Math.max(0,Math.min(100,nitro));

  speedText.textContent=
    Math.floor(speed);

  nitroFill.style.width=
    nitro+"%";

  /* DISTANCE */

  distance+=
    speed/9000*delta;

  distance=Math.min(100,distance);

  distanceText.textContent=
    Math.floor(distance);

  if(distance>=100){

    finishRace(true);
    return;
  }

  /* SPAWN */

  spawnTimer-=delta;

  if(spawnTimer<=0){

    spawnCar();

    spawnTimer=
      35+Math.random()*35;
  }

  /* ONCOMING TRAFFIC */

  if(Math.random()<0.008*delta){

    spawnOncoming();
  }

  /* MOVE CARS */

  enemies.forEach((enemy,index)=>{

    enemy.y +=
      (roadSpeed+
      enemy.speed+
      speed/70)*delta;

    enemy.el.style.top=
      enemy.y+"px";

    /* COLLISION */

    if(collision(player,enemy.el)){

      crash();

      enemy.el.remove();

      enemies.splice(index,1);
    }

    /* REMOVE */

    if(enemy.y>window.innerHeight+150){

      enemy.el.remove();

      enemies.splice(index,1);
    }
  });

  /* SPEED EFFECT */

  document.querySelectorAll(".speedLine")
  .forEach(line=>{

    line.style.animationDuration =
      Math.max(.08,
      .45-speed/900)+"s";

    line.style.opacity =
      speed>230 ? ".65" : "0";
  });
}

requestAnimationFrame(gameLoop);
</script>

</body>
</html>
