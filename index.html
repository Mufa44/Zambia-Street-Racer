<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zambia Street Racer</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050608;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 overflow:hidden;
}

#intro{
 position:fixed;
 inset:0;
 z-index:50;
 background:
 radial-gradient(circle at 50% 42%,rgba(30,90,120,.35),transparent 30%),
 linear-gradient(120deg,#020305,#10151c,#020305);
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 transition:opacity 1s;
}

.introBox{
 animation:introIn 1.5s ease;
}

@keyframes introIn{
 from{opacity:0;transform:scale(.85)}
 to{opacity:1;transform:scale(1)}
}

.flag{
 font-size:42px;
}

.logo{
 font-size:clamp(35px,8vw,80px);
 font-weight:900;
 letter-spacing:4px;
 margin:12px 0;
 text-shadow:0 0 25px #00b7ff;
}

.logo span{
 color:#08a957;
}

.tagline{
 color:#aaa;
 letter-spacing:4px;
 font-size:13px;
}

.enter{
 margin-top:45px;
 padding:16px 45px;
 border:1px solid #08a957;
 background:#08a957;
 color:#fff;
 font-weight:bold;
 font-size:16px;
 border-radius:4px;
 cursor:pointer;
 box-shadow:0 0 25px rgba(8,169,87,.4);
}

#garage{
 min-height:100vh;
 position:relative;
 background:
 radial-gradient(circle at 50% 45%,rgba(70,80,95,.25),transparent 30%),
 linear-gradient(180deg,#090c10,#030405);
}

.ceiling{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:28%;
 background:linear-gradient(#151a20,#060708);
 border-bottom:1px solid #252a30;
}

.light{
 position:absolute;
 top:10%;
 width:24%;
 height:5px;
 background:#dcefff;
 box-shadow:0 0 30px #dcefff;
}

.l1{left:8%}
.l2{left:38%}
.l3{right:8%}

.floor{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 height:48%;
 background:
 linear-gradient(170deg,transparent 48%,rgba(255,255,255,.04) 49%,transparent 50%),
 linear-gradient(#15171a,#070809);
 transform:perspective(500px) rotateX(8deg);
}

.header{
 position:absolute;
 z-index:10;
 top:0;
 left:0;
 right:0;
 height:76px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 border-bottom:1px solid rgba(255,255,255,.1);
 background:rgba(0,0,0,.35);
 backdrop-filter:blur(8px);
}

.smallLogo{
 font-weight:900;
 letter-spacing:2px;
}

.smallLogo b{
 color:#08a957;
}

.cash{
 padding:10px 16px;
 background:#101419;
 border:1px solid #28313a;
 border-radius:8px;
}

.content{
 position:absolute;
 z-index:5;
 top:90px;
 left:0;
 right:0;
 bottom:0;
 display:grid;
 grid-template-columns:260px 1fr 260px;
 gap:20px;
 padding:20px;
}

.panel{
 background:rgba(8,11,14,.78);
 border:1px solid #252d35;
 border-radius:12px;
 padding:20px;
 backdrop-filter:blur(10px);
}

.panelTitle{
 color:#8e9aa5;
 font-size:11px;
 letter-spacing:2px;
 margin-bottom:20px;
}

.carList button{
 display:block;
 width:100%;
 padding:15px;
 margin-bottom:10px;
 background:#101419;
 color:white;
 border:1px solid #27313a;
 border-radius:7px;
 text-align:left;
 cursor:pointer;
}

.carList button.active{
 border-color:#08a957;
 background:linear-gradient(90deg,#0c2b1c,#101419);
}

.carName{
 font-size:15px;
 font-weight:bold;
}

.carType{
 font-size:11px;
 color:#777;
 margin-top:4px;
}

.carArea{
 position:relative;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 min-width:0;
}

.carShadow{
 width:min(75%,520px);
 height:50px;
 background:#000;
 border-radius:50%;
 filter:blur(15px);
 margin-top:20px;
}

.car{
 position:relative;
 width:min(65%,390px);
 aspect-ratio:1.8/1;
 margin-top:-120px;
 transform:perspective(700px) rotateX(5deg);
 filter:drop-shadow(0 15px 20px rgba(0,0,0,.8));
}

.carBody{
 position:absolute;
 left:8%;
 right:8%;
 bottom:15%;
 height:48%;
 border-radius:45% 45% 18% 18%;
 background:linear-gradient(180deg,#f0f0f0,#777,#252525);
 border:2px solid #aaa;
}

.carTop{
 position:absolute;
 left:25%;
 right:25%;
 top:18%;
 height:35%;
 border-radius:55% 55% 15% 15%;
 background:linear-gradient(135deg,#182631,#79a5bb,#17222a);
 border:2px solid #555;
}

.windshield{
 position:absolute;
 left:30%;
 right:30%;
 top:23%;
 height:23%;
 background:#101b22;
 border-radius:40% 40% 5% 5%;
 transform:skewX(-12deg);
}

.headlight{
 position:absolute;
 width:12%;
 height:10%;
 top:49%;
 background:#eaffff;
 box-shadow:0 0 25px #bdfcff;
 border-radius:50%;
}

.hl1{left:12%}
.hl2{right:12%}

.grill{
 position:absolute;
 left:38%;
 right:38%;
 bottom:21%;
 height:13%;
 background:#050505;
 border-radius:3px;
 border:1px solid #555;
}

.wheel{
 position:absolute;
 width:17%;
 aspect-ratio:1;
 border-radius:50%;
 bottom:4%;
 background:#030303;
 border:5px solid #252525;
 box-shadow:inset 0 0 0 4px #777;
}

.w1{left:13%}
.w2{right:13%}

.carLabel{
 text-align:center;
 margin-top:-20px;
}

.carLabel h1{
 margin:0;
 font-size:clamp(28px,4vw,48px);
 letter-spacing:3px;
}

.carLabel p{
 color:#87919a;
 margin-top:7px;
}

.stat{
 margin-bottom:18px;
}

.statTop{
 display:flex;
 justify-content:space-between;
 font-size:12px;
 margin-bottom:6px;
}

.bar{
 height:5px;
 background:#222a30;
 border-radius:10px;
 overflow:hidden;
}

.fill{
 height:100%;
 background:linear-gradient(90deg,#08a957,#00d8ff);
}

.action{
 position:absolute;
 z-index:20;
 bottom:25px;
 left:50%;
 transform:translateX(-50%);
 width:260px;
 padding:17px;
 border:0;
 border-radius:7px;
 background:#08a957;
 color:#fff;
 font-weight:900;
 letter-spacing:2px;
 cursor:pointer;
 box-shadow:0 0 30px rgba(8,169,87,.35);
}

.action:hover{
 background:#0ac76a;
}

.upgrade{
 width:100%;
 margin-top:10px;
 padding:12px;
 background:#151a20;
 color:#fff;
 border:1px solid #2d3740;
 border-radius:6px;
 cursor:pointer;
}

.online{
 margin-top:25px;
 color:#08a957;
 font-size:12px;
}

.dot{
 display:inline-block;
 width:8px;
 height:8px;
 background:#08a957;
 border-radius:50%;
 box-shadow:0 0 10px #08a957;
 margin-right:6px;
}

@media(max-width:850px){

 .content{
  grid-template-columns:1fr;
  overflow-y:auto;
  padding-bottom:100px;
 }

 .panel{
  display:none;
 }

 .car{
  width:75%;
 }

 .carLabel{
  margin-top:0;
 }

 .action{
  bottom:15px;
 }

}

.hidden{
 display:none!important;
}
</style>
</head>

<body>

<!-- INTRO -->
<section id="intro">

 <div class="introBox">

  <div class="flag">🇿🇲</div>

  <div class="logo">
   ZAMBIA <span>STREET</span> RACER
  </div>

  <div class="tagline">
   THE STREETS ARE YOURS
  </div>

  <button class="enter" id="enterBtn">
   ENTER THE GARAGE
  </button>

 </div>

</section>


<!-- GARAGE -->
<main id="garage">

 <div class="ceiling">
  <div class="light l1"></div>
  <div class="light l2"></div>
  <div class="light l3"></div>
 </div>

 <div class="floor"></div>

 <header class="header">

  <div class="smallLogo">
   🇿🇲 ZAMBIA <b>STREET RACER</b>
  </div>

  <div class="cash">
   💰 K <span id="money">5,000</span>
  </div>

 </header>


 <div class="content">

  <!-- CARS -->
  <section class="panel">

   <div class="panelTitle">MY GARAGE</div>

   <div class="carList">

    <button class="active" data-car="ZR-X">
     <div class="carName">ZR-X</div>
     <div class="carType">STREET SUPERCAR</div>
    </button>

    <button data-car="KALULUSHI GT">
     <div class="carName">KALULUSHI GT</div>
     <div class="carType">PERFORMANCE COUPE</div>
    </button>

    <button data-car="LUSAKA RS">
     <div class="carName">LUSAKA RS</div>
     <div class="carType">STREET SEDAN</div>
    </button>

   </div>

   <div class="online">
    <span class="dot"></span>
    ONLINE SYSTEM READY
   </div>

  </section>


  <!-- CAR -->
  <section class="carArea">

   <div class="car" id="car">

    <div class="carBody"></div>
    <div class="carTop"></div>
    <div class="windshield"></div>

    <div class="headlight hl1"></div>
    <div class="headlight hl2"></div>

    <div class="grill"></div>

    <div class="wheel w1"></div>
    <div class="wheel w2"></div>

   </div>

   <div class="carShadow"></div>

   <div class="carLabel">

    <h1 id="carName">ZR-X</h1>

    <p id="carDescription">
     BUILT FOR THE NIGHT
    </p>

   </div>

  </section>


  <!-- STATS -->
  <section class="panel">

   <div class="panelTitle">VEHICLE PERFORMANCE</div>

   <div class="stat">
    <div class="statTop">
     <span>TOP SPEED</span>
     <span id="speedValue">92%</span>
    </div>
    <div class="bar">
     <div class="fill" id="speedBar" style="width:92%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statTop">
     <span>ACCELERATION</span>
     <span id="accelValue">88%</span>
    </div>
    <div class="bar">
     <div class="fill" id="accelBar" style="width:88%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statTop">
     <span>HANDLING</span>
     <span id="handlingValue">84%</span>
    </div>
    <div class="bar">
     <div class="fill" id="handlingBar" style="width:84%"></div>
    </div>
   </div>

   <div class="stat">
    <div class="statTop">
     <span>NITRO</span>
     <span id="nitroValue">96%</span>
    </div>
    <div class="bar">
     <div class="fill" id="nitroBar" style="width:96%"></div>
    </div>
   </div>

   <button class="upgrade">
    🔧 UPGRADE VEHICLE
   </button>

  </section>

 </div>


 <button class="action" id="startRace">
  🏁 START STREET RACE
 </button>

</main>


<script>

const intro = document.getElementById("intro");
const enterBtn = document.getElementById("enterBtn");
const startRace = document.getElementById("startRace");

const carName = document.getElementById("carName");
const carDescription = document.getElementById("carDescription");

const speedBar = document.getElementById("speedBar");
const accelBar = document.getElementById("accelBar");
const handlingBar = document.getElementById("handlingBar");
const nitroBar = document.getElementById("nitroBar");

const speedValue = document.getElementById("speedValue");
const accelValue = document.getElementById("accelValue");
const handlingValue = document.getElementById("handlingValue");
const nitroValue = document.getElementById("nitroValue");

const cars = {

 "ZR-X":{
  description:"BUILT FOR THE NIGHT",
  speed:92,
  acceleration:88,
  handling:84,
  nitro:96
 },

 "KALULUSHI GT":{
  description:"RAW POWER. ZERO FEAR.",
  speed:97,
  acceleration:91,
  handling:78,
  nitro:90
 },

 "LUSAKA RS":{
  description:"THE CITY'S STREET MACHINE",
  speed:86,
  acceleration:94,
  handling:93,
  nitro:87
 }

};


enterBtn.addEventListener("click",()=>{

 intro.style.opacity="0";

 setTimeout(()=>{
  intro.classList.add("hidden");
 },1000);

});


document.querySelectorAll(".carList button")
.forEach(button=>{

 button.addEventListener("click",()=>{

  document.querySelectorAll(".carList button")
   .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  const name=button.dataset.car;
  const car=cars[name];

  carName.textContent=name;
  carDescription.textContent=car.description;

  speedBar.style.width=car.speed+"%";
  accelBar.style.width=car.acceleration+"%";
  handlingBar.style.width=car.handling+"%";
  nitroBar.style.width=car.nitro+"%";

  speedValue.textContent=car.speed+"%";
  accelValue.textContent=car.acceleration+"%";
  handlingValue.textContent=car.handling+"%";
  nitroValue.textContent=car.nitro+"%";

 });

});


startRace.addEventListener("click",()=>{

 alert(
  "🏁 STREET RACE SYSTEM\n\n"+
  "Race mode is being connected next."
 );

});

</script>

</body>
</html>
